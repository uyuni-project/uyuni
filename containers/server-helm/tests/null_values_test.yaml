# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test null values in gateway
templates:
  - gateway.yaml
set:
  global.fqdn: uyuni.example.com
tests:
  - it: should not render the gateway when gateway is null
    set:
      gateway: null
    asserts:
      - hasDocuments:
          count: 0

  - it: should render the gateway when gateway.name is null
    set:
      gateway.enable: true
      gateway.name: null
    asserts:
      - hasDocuments:
          count: 1

  - it: should use the default listeners when gateway.listeners is null
    set:
      gateway.enable: true
      gateway.listeners: null
    asserts:
      - equal:
          path: spec.listeners[0]
          value:
            name: web
            protocol: HTTP
            port: 8000
            allowedRoutes:
              namespaces:
                from: Same
      - equal:
          path: spec.listeners[1].name
          value: websecure
      - equal:
          path: spec.listeners[1].port
          value: 8443

  - it: should not reuse the http name for the https listener
    set:
      gateway.enable: true
      gateway.listeners.http.name: plain
      gateway.listeners.https: null
    asserts:
      - equal:
          path: spec.listeners[0].name
          value: plain
      - equal:
          path: spec.listeners[1].name
          value: websecure

  - it: should render all TCP listeners when services and db are null
    set:
      gateway.enable: true
      exposeJavaDebug: true
      services: null
      db: null
    asserts:
      - lengthEqual:
          path: spec.listeners
          count: 7
      - notContains:
          path: spec.listeners
          content:
            name: reportdb-pgsql
          any: true

