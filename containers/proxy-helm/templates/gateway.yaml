{{- $gateway := .Values.gateway | default (dict) -}}
{{- $listeners := $gateway.listeners | default (dict) -}}
{{- $http := $listeners.http | default (dict) -}}
{{- $https := $listeners.https | default (dict) -}}
{{- $services := .Values.services | default (dict) -}}
{{- $servicesType := $services.type | default "ClusterIP" -}}
{{- $saltService := $services.salt | default (dict) -}}
{{- $sshService := $services.ssh | default (dict) -}}
{{- if and $gateway.enable (eq ($gateway.name | default "") "") }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: uyuni-gateway
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/part-of: uyuni
spec:
  gatewayClassName: "{{ $gateway.class }}"
  listeners:
    # HTTP/HTTPS Listeners
    - name: {{ $http.name | default "web" }}
      protocol: HTTP
      port: {{ $http.port | default 8000 }}
      allowedRoutes:
        namespaces:
          from: Same

    - name: {{ $https.name | default "websecure" }}
      protocol: HTTPS
      port: {{ $https.port | default 8443 }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: proxy-cert
      allowedRoutes:
        namespaces:
          from: Same

    # TCP Listeners
  {{- if ne (default $servicesType $saltService.type) "NodePort" }}
    - name: salt-publish
      protocol: TCP
      port: 4505
      allowedRoutes:
        namespaces:
          from: Same

    - name: salt-request
      protocol: TCP
      port: 4506
      allowedRoutes:
        namespaces:
          from: Same
  {{- end }}

  {{- if ne (default $servicesType $sshService.type) "NodePort" }}
    - name: ssh
      protocol: TCP
      port: 8022
      allowedRoutes:
        namespaces:
          from: Same
  {{- end }}
{{- end }}

