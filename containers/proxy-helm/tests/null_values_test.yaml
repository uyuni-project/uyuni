# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test null values in configmap
templates:
  - templates/config.yaml
set:
  global.config: |
    max_cache_size_mb: 2048
    server: parent.example.org
    proxy_fqdn: proxy.example.org
    email: foo@example.org
  global.httpd: "httpd_content: test httpd"
  global.ssh: "ssh_content: test ssh"
tests:
  - it: should render empty tuning when the components are null
    set:
      squid: null
      ssh: null
      httpd: null
      salt: null
    asserts:
      - equal:
          path: data.squid_tuning
          value: "# Add your Squid tuning configuration here\n"
        documentSelector: &configmap
          path: metadata.name
          value: proxy-configmap
      - equal:
          path: data.ssh_tuning
          value: "# Add your SSHd tuning configuration here\n"
        documentSelector: *configmap
      - equal:
          path: data.apache_tuning
          value: "# Add your Apache tuning configuration here\n"
        documentSelector: *configmap
      - equal:
          path: data.salt_tuning
          value: "# Add your Salt Broker tuning configuration here\n{}\n"
        documentSelector: *configmap

  - it: should render empty tuning when the tuning values are null
    set:
      squid.tuning: null
      ssh.tuning: null
      httpd.tuning: null
      salt.tuning: null
    asserts:
      - equal:
          path: data.squid_tuning
          value: "# Add your Squid tuning configuration here\n"
        documentSelector: *configmap
      - equal:
          path: data.salt_tuning
          value: "# Add your Salt Broker tuning configuration here\n{}\n"
        documentSelector: *configmap

