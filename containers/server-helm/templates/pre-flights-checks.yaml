{{- if not .Values.skipPreFlight -}}
  {{- if (lookup "v1" "PersistentVolumeClaim" .Release.Namespace "ca-certs") }}
    {{- $ns := .Release.Namespace }}
    {{- $msg := list
        "ERROR: The ca-certs PVC still exists on the cluster."
        "Custom CA certificates stored in this PVC must be recovered BEFORE upgrading."
        ""
        "To proceed:"
        "  1. Check the reclaim policy of the storage class used by the ca-certs PVC:"
        (printf "     SC=$(kubectl get pvc ca-certs -n %s -o jsonpath='{.spec.storageClassName}')" $ns)
        "     kubectl get storageclass \"$SC\" -o jsonpath='{.reclaimPolicy}'"
        ""
        "     - If the reclaim policy is 'Delete': the PV and its data will be permanently"
        "       removed when the PVC is deleted. You MUST recover the custom CA certificates"
        "       before proceeding (see step 2)."
        ""
        "     - If the reclaim policy is 'Retain': the PV will be preserved after the PVC is"
        "       deleted, but it will not be automatically reused. You should still recover the"
        "       custom CA certificates before proceeding to avoid manual PV rebinding."
        ""
        "  2. Recover the custom CA certificates you added to the ca-certs PVC and store them"
        "     in the trust-anchors ConfigMap. The currently running server pod must still be up."
        ""
        "     a. List the files stored in the PVC:"
        (printf "          kubectl exec deploy/uyuni -n %s -c uyuni -- ls /etc/pki/trust/anchors/" $ns)
        ""
        "        Ignore the files generated by Uyuni: LOCAL-RHN-ORG-TRUSTED-SSL-CERT,"
        "        DB-RHN-ORG-TRUSTED-SSL-CERT, salt-api.crt, peripheral_* and hub_*."
        "        They are recreated automatically."
        ""
        "     b. Copy each of your custom certificates to your workstation:"
        (printf "          kubectl exec deploy/uyuni -n %s -c uyuni -- cat /etc/pki/trust/anchors/my-corp.crt > my-corp.crt" $ns)
        ""
        "     c. Create the trust-anchors ConfigMap with all of them"
        "        (add one --from-file option per certificate):"
        (printf "          kubectl create configmap trust-anchors -n %s \\" $ns)
        "              --from-file=my-corp.crt=./my-corp.crt \\"
        "              --dry-run=client -o yaml | kubectl apply -f -"
        ""
        "  3. Stop the server and delete the PVC. The PVC cannot be deleted while the server"
        "     pod still mounts it, and the upgrade keeps failing until it is gone."
        "     Only do this after the certificates have been recovered, the data is lost afterwards:"
        (printf "          kubectl scale deploy/uyuni -n %s --replicas=0" $ns)
        (printf "          kubectl delete pvc ca-certs -n %s" $ns)
        ""
        "  4. Re-run helm upgrade"
    | join "\n" }}
    {{- fail $msg }}
  {{- end -}}
{{- end -}}
