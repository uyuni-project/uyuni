# @schema
# -- Confidential computing attestation component configuration
coco:
  # @default `nil`
  # @schema
  # type: ["string", "null"]
  # @schema
  # -- Image for the confidential computing containers, overwriting the one computed with the `repository` value
  image: null

  # @default `nil`
  # @schema
  # type: ["string", "null"]
  # @schema
  # -- Image tag for the confidential computing containers, overwriting the global one
  tag: null

  # @schema
  # minimum: 0
  # @schema
  # -- Number the confidential computing pods replicas
  replicas: 0

# @schema
# type: ["object", "null"]
# allOf:
#   - $ref: "#/definitions/imageConfig"
#   - $ref: "#/definitions/nodeSelectorConfig"
# @schema
# -- Saline component configuration
saline:
  # @default `nil`
  # @schema
  # type: ["string", "null"]
  # @schema
  # -- Image for the Saline container, overwriting the one computed with the `repository` value
  image: null

  # @default `nil`
  # @schema
  # type: ["string", "null"]
  # @schema
  # -- Image tag for the Saline container, overwriting the global one
  tag: null

  # -- Enable the Saline pod
  enable: false

# @schema
