{{- $gateway := .Values.gateway | default (dict) -}}
{{- $ingress := .Values.ingress | default (dict) -}}
{{- $services := .Values.services | default (dict) -}}
{{- $servicesType := $services.type | default "ClusterIP" -}}
{{- $reportdb := $services.reportdb | default (dict) -}}
{{- $salt := $services.salt | default (dict) -}}
{{- $taskomatic := $services.taskomatic | default (dict) -}}
{{- $search := $services.search | default (dict) -}}
{{- $tomcat := $services.tomcat | default (dict) -}}
{{- if and (not $gateway.enable) (eq ($ingress.type | default "") "traefik") }}

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: uyuni-https-redirect
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/part-of: uyuni
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: uyuni-strip-prefixes
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: uyuni
spec:
  stripPrefix:
    prefixes:
      - /postgresql-exporter
      - /node-exporter
      - /tasko-exporter
      - /tasko-jmx
      - /tomcat-jmx
      - /saline
{{- if ne ($salt.type | default $servicesType) "NodePort" }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: salt-publish-route
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/part-of: uyuni
  annotations:
    kubernetes.io/ingress.class: {{ $ingress.class | quote }}
spec:
  entryPoints:
    - salt-publish
  routes:
    - match: HostSNI(`*`)
      services:
      - name: salt
        port: 4505
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: salt-request-route
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/part-of: uyuni
  annotations:
    kubernetes.io/ingress.class: {{ $ingress.class | quote }}
spec:
  entryPoints:
    - salt-request
  routes:
    - match: HostSNI(`*`)
      services:
      - name: salt
        port: 4506
{{- end }}
{{- if .Values.exposeJavaDebug }}
{{- if ne ($taskomatic.type | default $servicesType) "NodePort" }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: tomcat-debug-route
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/part-of: uyuni
  annotations:
    kubernetes.io/ingress.class: {{ $ingress.class | quote }}
spec:
  entryPoints:
    - tomcat-debug
  routes:
    - match: HostSNI(`*`)
      services:
      - name: tomcat
        port: 8003
{{- end }}
{{- if ne ($search.type | default $servicesType) "NodePort" }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: search-debug-route
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/part-of: uyuni
  annotations:
    kubernetes.io/ingress.class: {{ $ingress.class | quote }}
spec:
  entryPoints:
    - search-debug
  routes:
    - match: HostSNI(`*`)
      services:
      - name: search
        port: 8002
{{- end }}
{{- if ne ($tomcat.type | default $servicesType) "NodePort" }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: tasko-debug-route
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/part-of: uyuni
  annotations:
    kubernetes.io/ingress.class: {{ $ingress.class | quote }}
spec:
  entryPoints:
    - tasko-debug
  routes:
    - match: HostSNI(`*`)
      services:
      - name: taskomatic
        port: 8001
{{- end }}
{{- end }}
{{- end }}
