# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test null values in services
templates:
  - services.yaml
set:
  global.fqdn: uyuni.example.com
  exposeJavaDebug: true
tests:
  - it: should default to ClusterIP services when services is null
    set:
      services: null
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
        documentSelector:
          path: metadata.name
          value: salt
      - notExists:
          path: metadata.annotations
        documentSelector:
          path: metadata.name
          value: salt

  - it: should fall back to the default node ports when the ports are null
    set:
      services:
        type: NodePort
        reportdb: {ports: null}
        salt: {ports: null}
        search: {ports: null}
        taskomatic: {ports: null}
        tomcat: {ports: null}
    asserts:
      - equal:
          path: spec.ports[?(@.name=="pgsql")].nodePort
          value: 30032
        documentSelector:
          path: metadata.name
          value: reportdb
      - equal:
          path: spec.ports[?(@.name=="publish")].nodePort
          value: 30005
        documentSelector:
          path: metadata.name
          value: salt
      - equal:
          path: spec.ports[?(@.name=="request")].nodePort
          value: 30006
        documentSelector:
          path: metadata.name
          value: salt
      - equal:
          path: spec.ports[0].nodePort
          value: 30002
        documentSelector:
          path: metadata.name
          value: search
      - equal:
          path: spec.ports[0].nodePort
          value: 30001
        documentSelector:
          path: metadata.name
          value: taskomatic
      - equal:
          path: spec.ports[0].nodePort
          value: 30003
        documentSelector:
          path: metadata.name
          value: tomcat

  - it: should use the global type and annotations when per-service entries are null
    set:
      services:
        type: LoadBalancer
        annotations:
          foo: bar
        reportdb: null
        salt: null
        search: null
        taskomatic: null
        tomcat: null
        tftp: null
      tftp.enable: true
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
        documentSelector:
          path: metadata.name
          value: salt
      - equal:
          path: spec.type
          value: LoadBalancer
        documentSelector:
          path: metadata.name
          value: tomcat
      - equal:
          path: metadata.annotations
          value:
            foo: bar
        documentSelector:
          path: metadata.name
          value: tftp
      - equal:
          path: spec.externalTrafficPolicy
          value: Local
        documentSelector:
          path: metadata.name
          value: reportdb

  - it: should skip optional services when their configuration is null
    set:
      db: null
      tftp: null
      hubAPI: null
      saline: null
    asserts:
      - hasDocuments:
          count: 0
        documentSelector:
          path: metadata.name
          value: reportdb
          skipEmptyTemplates: true
      - hasDocuments:
          count: 0
        documentSelector:
          path: metadata.name
          value: tftp
          skipEmptyTemplates: true
      - hasDocuments:
          count: 0
        documentSelector:
          path: metadata.name
          value: hub-xmlrpc
          skipEmptyTemplates: true
      - hasDocuments:
          count: 0
        documentSelector:
          path: metadata.name
          value: saline
          skipEmptyTemplates: true

