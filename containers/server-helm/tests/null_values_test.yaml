# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test null values in config
templates:
  - config.yaml
set:
  global.fqdn: uyuni.example.com
tests:
  - it: should require server.email when server is null
    set:
      server: null
    asserts:
      - failedTemplate:
          errorMessage: server.email is needed!

  - it: should use the default database connection when db is null
    set:
      db: null
    asserts:
      - equal:
          path: data.db_host
          value: db
      - equal:
          path: data.db_port
          value: "5432"
      - equal:
          path: data.db_name
          value: susemanager
      - equal:
          path: data.reportdb_host
          value: reportdb
      - equal:
          path: data.reportdb_port
          value: "5432"
      - equal:
          path: data.reportdb_name
          value: reportdb

  - it: should use the default external database connection when its values are null
    set:
      db:
        enable: false
        internal: null
        report: {host: null, port: null, name: null}
    asserts:
      - equal:
          path: data.db_host
          value: db
      - equal:
          path: data.db_port
          value: "5432"
      - equal:
          path: data.db_name
          value: susemanager
      - equal:
          path: data.reportdb_host
          value: reportdb
      - equal:
          path: data.reportdb_port
          value: "5432"
      - equal:
          path: data.reportdb_name
          value: reportdb

