{{- $db := .Values.db | default (dict) -}}
{{- $tftpVal := .Values.tftp | default (dict) -}}
{{- $hubAPI := .Values.hubAPI | default (dict) -}}
{{- $saline := .Values.saline | default (dict) -}}
{{- $services := .Values.services | default (dict) -}}
{{- $servicesType := $services.type | default "ClusterIP" -}}
{{- $reportdb := $services.reportdb | default (dict) -}}
{{- $reportdbPorts := $reportdb.ports | default (dict) -}}
{{- $salt := $services.salt | default (dict) -}}
{{- $saltPorts := $salt.ports | default (dict) -}}
{{- $search := $services.search | default (dict) -}}
{{- $searchPorts := $search.ports | default (dict) -}}
{{- $taskomatic := $services.taskomatic | default (dict) -}}
{{- $taskomaticPorts := $taskomatic.ports | default (dict) -}}
{{- $tomcat := $services.tomcat | default (dict) -}}
{{- $tomcatPorts := $tomcat.ports | default (dict) -}}
{{- $tftp := $services.tftp | default (dict) }}
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: uyuni
  name: cobbler
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: cobbler
      port: 25151
  selector:
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: uyuni
  type: ClusterIP
{{- if $db.enable }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: db
    app.kubernetes.io/part-of: uyuni
  name: db
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: pgsql
      port: 5432
  selector:
    app.kubernetes.io/component: db
    app.kubernetes.io/part-of: uyuni
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: db
    app.kubernetes.io/part-of: uyuni
  name: reportdb
  namespace: "{{ .Release.Namespace }}"
{{- if or $services.annotations $reportdb.annotations }}
  annotations:
{{ toYaml ( mergeOverwrite (dict) (default (dict) $services.annotations) (default (dict) $reportdb.annotations) ) | indent 4 }}
{{- end }}
spec:
  ports:
    - name: pgsql
      port: 5432
{{- if eq (default $servicesType $reportdb.type) "NodePort" }}
      nodePort: {{ $reportdbPorts.pgsql | default 30032 }}
{{- end }}
{{- if eq (default $servicesType $reportdb.type) "LoadBalancer" }}
  externalTrafficPolicy: Local
{{- end }}
  selector:
    app.kubernetes.io/component: db
    app.kubernetes.io/part-of: uyuni
  type: {{ $reportdb.type | default $servicesType }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: uyuni
  name: salt
  namespace: "{{ .Release.Namespace }}"
{{- if or $services.annotations $salt.annotations }}
  annotations:
{{ toYaml ( mergeOverwrite (dict) (default (dict) $services.annotations) (default (dict) $salt.annotations) ) | indent 4 }}
{{- end }}
spec:
  ports:
    - name: publish
      port: 4505
{{- if eq (default $servicesType $salt.type) "NodePort" }}
      nodePort: {{ $saltPorts.publish | default 30005 }}
{{- end }}
    - name: request
      port: 4506
{{- if eq (default $servicesType $salt.type) "NodePort" }}
      nodePort: {{ $saltPorts.request | default 30006 }}
{{- end }}
  selector:
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: uyuni
  type: {{ $salt.type | default $servicesType }}
---
{{- if .Values.exposeJavaDebug | default false }}
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: uyuni
  name: search
  namespace: "{{ .Release.Namespace }}"
{{- if or $services.annotations $search.annotations }}
  annotations:
{{ toYaml ( mergeOverwrite (dict) (default (dict) $services.annotations) (default (dict) $search.annotations) ) | indent 4 }}
{{- end }}
spec:
  ports:
    - name: debug
      port: 8002
{{- if eq (default $servicesType $search.type) "NodePort" }}
      nodePort: {{ $searchPorts.debug | default 30002 }}
{{- end }}
  selector:
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: uyuni
  type: {{ $search.type | default $servicesType }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: uyuni
  name: taskomatic
  namespace: "{{ .Release.Namespace }}"
{{- if or $services.annotations $taskomatic.annotations }}
  annotations:
{{ toYaml ( mergeOverwrite (dict) (default (dict) $services.annotations) (default (dict) $taskomatic.annotations) ) | indent 4 }}
{{- end }}
spec:
  ports:
    - name: debug
      port: 8001
{{- if eq (default $servicesType $taskomatic.type) "NodePort" }}
      nodePort: {{ $taskomaticPorts.debug | default 30001 }}
{{- end }}
  selector:
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: uyuni
  type: {{ $taskomatic.type | default $servicesType }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: uyuni
  name: tomcat
  namespace: "{{ .Release.Namespace }}"
{{- if or $services.annotations $tomcat.annotations }}
  annotations:
{{ toYaml ( mergeOverwrite (dict) (default (dict) $services.annotations) (default (dict) $tomcat.annotations) ) | indent 4 }}
{{- end }}
spec:
  ports:
    - name: debug
      port: 8003
{{- if eq (default $servicesType $tomcat.type) "NodePort" }}
      nodePort: {{ $tomcatPorts.debug | default 30003 }}
{{- end }}
  selector:
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: uyuni
  type: {{ $tomcat.type | default $servicesType }}
---
{{- end }}
{{- if ne .Values.enableMonitoring false }}
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: uyuni
  name: taskomatic-internal
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: jmx
      port: 5557
    - name: mtrx
      port: 9800
  selector:
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: uyuni
  type: ClusterIP
---
{{- end }}
{{- if and $tftpVal.enable (not $tftpVal.hostNetwork) }}
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: tftp
    app.kubernetes.io/part-of: uyuni
  name: tftp
  namespace: "{{ .Release.Namespace }}"
{{- if or $services.annotations $tftp.annotations }}
  annotations:
{{ toYaml ( mergeOverwrite (dict) (default (dict) $services.annotations) (default (dict) $tftp.annotations) ) | indent 4 }}
{{- end }}
spec:
  ports:
    - name: tftp
      port: 69
      protocol: UDP
      targetPort: 69
  selector:
    app.kubernetes.io/component: tftp
    app.kubernetes.io/part-of: uyuni
  # ClusterIP or NodePort wouldn't work for TFTP if not using the host network
  type: LoadBalancer
  # Ensures all packets from a single client go to the same pod
  sessionAffinity: ClientIP
  # Preserves the client's source IP and avoids extra hops between nodes
  externalTrafficPolicy: Local
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: uyuni
  name: tomcat-internal
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: node-exporter
      port: 9100
{{- if ne .Values.enableMonitoring false }}
    - name: jmx
      port: 5556
    - name: pgsql-exporter
      port: 9187
{{- end }}
  selector:
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: uyuni
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: uyuni
  name: web
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80
  selector:
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: uyuni
  type: ClusterIP
{{- if default $hubAPI.enable false }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: hub-xmlrpc
    app.kubernetes.io/part-of: uyuni
  name: hub-xmlrpc
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: hub
      port: 2830
  selector:
    app.kubernetes.io/component: hub-xmlrpc
    app.kubernetes.io/part-of: uyuni
  type: ClusterIP
{{- end }}
{{- if default $saline.enable false }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: saline
    app.kubernetes.io/part-of: uyuni
  name: saline
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: saline
      port: 8216
  selector:
    app.kubernetes.io/component: saline
    app.kubernetes.io/part-of: uyuni
  type: ClusterIP
{{- end }}
