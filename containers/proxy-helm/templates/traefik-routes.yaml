{{- $gateway := .Values.gateway | default (dict) -}}
{{- $ingress := .Values.ingress | default (dict) -}}
{{- $services := .Values.services | default (dict) -}}
{{- $servicesType := $services.type | default "ClusterIP" -}}
{{- $servicesSalt := $services.salt | default (dict) -}}
{{- $servicesSsh := $services.ssh | default (dict) -}}

{{- if and (not $gateway.enable) (eq $ingress.type "traefik") }}
{{- $entryPoints := $ingress.entryPoints | default (dict) }}
  {{- if ne (default $servicesType $servicesSsh.type) "NodePort" }}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: ssh-router
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: uyuni
  {{- if $ingress.class }}
  annotations:
    kubernetes.io/ingress.class: {{ $ingress.class | quote }}
  {{- end }}
spec:
  entryPoints:
    - {{ $entryPoints.ssh | default "ssh" }}
  routes:
    - match: HostSNI(`*`)
      services:
      - name: ssh
        port: 8022
---
  {{- end }}
  {{- if ne (default $servicesType $servicesSalt.type) "NodePort" }}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: salt-publish-router
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: uyuni
  {{- if $ingress.class }}
  annotations:
    kubernetes.io/ingress.class: {{ $ingress.class | quote }}
  {{- end }}
spec:
  entryPoints:
    - {{ $entryPoints.saltPublish | default "salt-publish" }}
  routes:
    - match: HostSNI(`*`)
      services:
      - name: salt
        port: 4505
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: salt-request-router
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: uyuni
  {{- if $ingress.class }}
  annotations:
    kubernetes.io/ingress.class: {{ $ingress.class | quote }}
  {{- end }}
spec:
  entryPoints:
    - {{ $entryPoints.saltRequest | default "salt-request" }}
  routes:
    - match: HostSNI(`*`)
      services:
      - name: salt
        port: 4506
  {{- end }}
{{- end }}

