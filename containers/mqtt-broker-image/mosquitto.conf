# Mosquitto broker configuration for Uyuni MQTT event publishing
#
# The listeners are not set here: uyuni-configure.sh writes them to
# conf.d/listeners.conf at start-up, adding a TLS listener when certificates
# are mounted. Authentication and access control below apply to every listener.

allow_anonymous false
password_file /mosquitto/config/passwd

acl_file /mosquitto/config/acl.conf

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

include_dir /mosquitto/config/conf.d
