# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test null values in traefik-routes
templates:
  - templates/traefik-routes.yaml
set:
  global.config: |
    max_cache_size_mb: 2048
    server: parent.example.org
    proxy_fqdn: proxy.example.org
    email: foo@example.org
  global.httpd: "httpd_content: test httpd"
  global.ssh: "ssh_content: test ssh"
tests:
  - it: should render all routes when gateway and services are null
    set:
      gateway: null
      services: null
    asserts:
      - hasDocuments:
          count: 3

  - it: should not render routes when ingress is null
    set:
      ingress: null
    asserts:
      - hasDocuments:
          count: 0

  - it: should use the default entry points and no class when they are null
    set:
      ingress:
        class: null
        entryPoints: null
    asserts:
      - notExists:
          path: metadata.annotations
      - equal:
          path: spec.entryPoints
          value: [ssh]
        documentSelector:
          path: metadata.name
          value: ssh-router
      - equal:
          path: spec.entryPoints
          value: [salt-publish]
        documentSelector:
          path: metadata.name
          value: salt-publish-router
      - equal:
          path: spec.entryPoints
          value: [salt-request]
        documentSelector:
          path: metadata.name
          value: salt-request-router

  - it: should use the default entry points when single entries are null
    set:
      ingress.entryPoints: {ssh: null, saltPublish: null, saltRequest: null}
    asserts:
      - equal:
          path: spec.entryPoints
          value: [ssh]
        documentSelector:
          path: metadata.name
          value: ssh-router

