{{- $gateway := .Values.gateway | default (dict) -}}
{{- $listeners := $gateway.listeners | default (dict) -}}
{{- $http := $listeners.http | default (dict) -}}
{{- $https := $listeners.https | default (dict) -}}
{{- if $gateway.enable }}
{{- $config := .Values.global.config | fromYaml }}
{{- $gatewayName := $gateway.name | default "uyuni-gateway" -}}

# HTTPS Routes
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: proxy-routes
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/part-of: uyuni
    app.kubernetes.io/component: proxy
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      sectionName: {{ $https.name | default "websecure" }}
    - name: {{ $gatewayName }}
      sectionName: {{ $http.name | default "web" }}
  hostnames:
    - {{ $config.proxy_fqdn | quote }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: web
          port: 80
{{- end }}


