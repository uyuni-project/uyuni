# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test null values in ingress
templates:
  - ingress.yaml
set:
  global.fqdn: uyuni.example.com
tests:
  - it: should render the default ingresses when gateway, saline and hubAPI are null
    set:
      gateway: null
      saline: null
      hubAPI: null
    asserts:
      - hasDocuments:
          count: 4

  - it: should render generic ingresses when ingress is null
    set:
      ingress: null
    asserts:
      - notExists:
          path: spec.ingressClassName
        documentSelector:
          path: metadata.name
          value: uyuni-ingress-ssl
      - isNullOrEmpty:
          path: metadata.annotations
        documentSelector:
          path: metadata.name
          value: uyuni-ingress-ssl

  - it: should render the ingresses when ingress.annotations is null
    set:
      saline.enable: true
      hubAPI.enable: true
      ingress.annotations: null
    asserts:
      - hasDocuments:
          count: 6

