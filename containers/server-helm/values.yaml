# @schema
# repository -- The default repository with the path where to find all the images.
repository: registry.opensuse.org/uyuni

# tag -- The default tag to use for all the images, can be overridden
tag: latest

# @schema
# enum: ["Always", "IfNotPresent", "Never"]
# @schema
# pullPolicy -- Images pull policy. See: https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy
pullPolicy: "IfNotPresent"

# registrySecret -- name of secret to use to pull the images from the
# registry with authentication. Leave empty for no authentication.
registrySecret: ""

# timezone -- The time zone to set in the containers
timezone: "Etc/UTC"

# @default `{}`
# @schema
# $ref: "#/definitions/nodeSelectorConfig"
# @schema
# placement -- Default node placement rules for all pods
placement: {}

# @schema
# type: ["object", "null"]
# allOf:
#   - $ref: "#/definitions/imageConfig"
#   - $ref: "#/definitions/nodeSelectorConfig"
# @schema
# -- Server component configuration
server:
  # @default `nil`
  # @schema
  # type: ["string", "null"]
  # @schema
  # -- image overrides the default image computed using the repository property. Leave undefined to use the default
  image: null

  # @default `nil`
  # @schema
  # type: ["string", "null"]
  # @schema
  # -- tag overrides the default tag in the tag property. Leave undefined to use the default
  tag: null

  # -- Email will be the email used for the notifications sent by the server.
  email: "admin@uyuni.lab.org"

  # -- sccSecret is the name of a basic-auth secret with the organization mirroring credentials to set up on the server.
  sccSecret: ""

  # -- mirror defines a volume or host path to mount in the container as server.susemanager.fromdir value.
  mirror:
    # -- claimName is the name of the PVC to use for the mirror volume.
    claimName: ""
    # -- hostPath is the path on the node to mount as mirror.
    hostPath: ""

  # @schema
  # type: ["array", "null"]
  # items: {type: "object"}
  # @schema
  # -- extraVolumes defines additional Kubernetes volumes for the server pod.
  extraVolumes: []

  # @schema
  # type: ["array", "null"]
  # items: {type: "object"}
  # @schema
  # -- extraVolumeMounts defines additional mounts for the server container.
  extraVolumeMounts: []

  # -- superPrivileged may need to be set to true to run on a cluster with selinux or AppArmor enforced.
  superPrivileged: false

  # @schema
  # enum: ["debug", "info", "notice", "warning", "err", "crit", "alert", "emerg", ""]
  # @schema
  # -- systemdLogLevel will be passed to systemd's --log-level parameter.
  systemdLogLevel: ""

  # -- appArmor profile is the name of an AppArmor profile to use for the server pod.
  apparmorProfile: ""

  # -- SELinux type is the name of the SELinux type to use for the server pod.
  selinuxType: ""

# @schema
# required: true
# @schema
global:
  # @default `nil`
  # @schema
  # required: true
  # @schema
  # -- fqdn is the fully qualified name the server will answer as.
  fqdn: null

# -- Services tuning properties.
services:

  # @schema
  # enum: ["ClusterIP", "NodePort", "LoadBalancer"]
  # @schema
  # -- type of all the externally-facing services. Can be overridden on each service.
  type: ClusterIP

  # @default `nil`
  # @schema
  # type: ["object", "null"]
  # @schema
  # -- annotations to set to all the services. Merged with the service ones.
  annotations: null

  # @schema
  # $ref: "#/definitions/serviceConfig"
  # @schema
  # -- Values setting up the reportdb service.
  reportdb:
    type: ""
    ports:
      # -- Port to use as a NodePort service
      pgsql: 30032
    # @default `nil`
    annotations: null

  # @schema
  # $ref: "#/definitions/serviceConfig"
  # @schema
  # -- Values setting up the salt service.
  salt:
    type: ""
    ports:
      # -- Port to use as a NodePort service
      publish: 30005
      # -- Port to use as a NodePort service
      request: 30006
    # @default `nil`
    annotations: null

  # @schema
  # $ref: "#/definitions/serviceConfig"
  # @schema
  # -- Values setting up the search server service.
  search:
    type: ""
    ports:
      # -- Port to use as a NodePort service
      debug: 30002
    # @default `nil`
    annotations: null

  # @schema
  # $ref: "#/definitions/serviceConfig"
  # @schema
  # -- Values setting up the taskomatic service.
  taskomatic:
    type: ""
    ports:
      # -- Port to use as a NodePort service
      debug: 30001
    # @default `nil`
    annotations: null

  # @schema
  # $ref: "#/definitions/serviceConfig"
  # @schema
  # -- Values setting up the tomcat service.
  tomcat:
    type: ""
    ports:
      # -- Port to use as a NodePort service
      debug: 30003
    # @default `nil`
    annotations: null

  # @schema
  # type: ["object", "null"]
  # @schema
  # -- Values setting up the tftp service.
  tftp:
    # @default `nil`
    # @schema
    # type: ["object", "null"]
    # @schema
    annotations: null

# -- exposeJavaDebug will expose ports 8001, 8002, and 8003 for Java debugging.
exposeJavaDebug: false

# -- enableMonitoring will create the ingress or gateway routes for Prometheus exporters.
enableMonitoring: true

ingress:
  # @schema
  # enum: ["traefik", ""]
  # @schema
  # -- ingress.type defines the ingress that is used in the cluster.
  type: "traefik"

  # -- Specify the ingress class name to use.
  class: "traefik"

  # -- Custom annotations for ingress rules.
  annotations:
    ssl: {}
    sslRedirect: {}
    nossl: {}
    saline: {}
    hub: {}
    exporters: {}

# -- Gateway configures the Gateway API.
gateway:
  enable: false
  class: ""
  name: ""

  listeners:
    # @schema
    # $ref: "#/definitions/listener"
    # @schema
    # -- Configuration of the HTTP listener.
    http:
      name: "web"
      port: 8000

    # @schema
    # $ref: "#/definitions/listener"
    # @schema
    # -- Configuration of the HTTPS listener.
    https:
      name: "websecure"
      port: 8443

# @schema
# type: ["object", "null"]
# allOf:
#   - $ref: "#/definitions/imageConfig"
#   - $ref: "#/definitions/nodeSelectorConfig"
# @schema
# -- TFTP server configuration
tftp:
  # @default `nil`
  # @schema
  # type: ["string", "null"]
  # @schema
  image: null

  # @default `nil`
  # @schema
  # type: ["string", "null"]
  # @schema
  tag: null

  enable: false
  hostNetwork: false

# @schema
# type: ["object", "null"]
# allOf:
