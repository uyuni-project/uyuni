# Generated by helm-questions from the x-rancher-question annotations in the values schema.
# Do not edit, update the annotations and run helm questions again.
questions:
  - variable: global.config
    label: Proxy Configuration (config.yaml)
    description: Content of the config.yaml file generated by the server. See the Systems > Proxy Configuration page on the server  or the proxy.containerConfig API documentation.
    type: multiline
    group: General
  - variable: global.httpd
    label: Apache Configuration (httpd.yaml)
    description: Content of the httpd.yaml file generated by the server. See the Systems > Proxy Configuration page on the server  or the proxy.containerConfig API documentation.
    type: multiline
    group: General
  - variable: global.ssh
    label: SSH Configuration (ssh.yaml)
    description: Content of the ssh.yaml file generated by the server. See the Systems > Proxy Configuration page on the server  or the proxy.containerConfig API documentation.
    type: multiline
    group: General
  - variable: repository
    label: Image Repository
    description: The default repository with the path where to find all the images.
    type: string
    default: registry.opensuse.org/uyuni
    group: General
  - variable: tag
    label: Image Tag
    description: The default tag to use for all the images, can be overridden By default the tag will be the appVersion of the Chart.
    type: string
    group: General
  - variable: pullPolicy
    label: Image Pull Policy
    description: 'Images pull policy. See: https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy'
    type: enum
    default: Always
    options:
      - Always
      - IfNotPresent
      - Never
    group: General
  - variable: registrySecret
    label: Registry Pull Secret
    description: Name of the secret used to pull the images from a registry with authentication. Leave empty for no authentication. Once selected, it can only be cleared by editing the values YAML.
    type: secret
    default: ""
    group: General
  - variable: gateway.enable
    label: Use Gateway API
    description: If enabled, Gateway API 1.4 resources will be deployed instead of the ingress ones. Note that TCPRoute is used and is still in alpha2 stage.
    type: boolean
    default: false
    group: General
    show_subquestion_if: true
    subquestions:
      - variable: gateway.class
        label: Gateway Class
        description: Name of the gateway class to use. For rke2 with traefik, it is likely to be "traefik".
        type: string
        default: ""
      - variable: gateway.name
        label: Gateway Name
        description: Name of the Gateway to use. If left empty an uyuni-gateway will be created.
        type: string
        default: ""
  - variable: ingress.type
    label: Ingress Type
    description: Ingress that is used in the cluster. Set to the empty string to use a custom ingress.
    type: enum
    default: traefik
    options:
      traefik: traefik
      "": Custom ingress
    group: General
    show_if: gateway.enable=false
  - variable: ingress.class
    label: Ingress Class
    description: 'providers.kubernetescrd.ingressclass parameter''s value. On rke2 this is likely to be "traefik". On K3S it is likely to be "" '
    type: string
    default: traefik
    group: General
    show_if: gateway.enable=false
  - variable: services.type
    label: Service Type
    description: type of all the externally-facing services. Can be overridden on each service.
    type: enum
    default: ClusterIP
    options:
      - ClusterIP
      - NodePort
      - LoadBalancer
    group: General
  - variable: tftp.hostNetwork
    label: TFTP Use Host Network
    description: Use the host network to bypass the Kubernetes network layers. This may be needed if not using a LoadBalancer for the TFTP server. Note that this may be more complex to manage on multi-node clusters.
    type: boolean
    default: false
    group: General
  - variable: volumes.squid.storageClass
    label: Squid Cache Storage Class
    description: Storage class used for the squid cache volume claim. Leave empty to use the cluster default. Once selected, it can only be cleared by editing the values YAML.
    type: storageclass
    group: General
  - variable: cert.takeOwnership
    label: Take Ownership of Existing Certificates
    description: opts in to rendering proxy-cert and uyuni-ca even when objects with those names already exist in the namespace and were NOT created by helm. The default (false) leaves pre-existing objects alone so install/upgrade does not fail and the chart never silently overwrites something it did not create.  Set to true together with `helm install --take-ownership` (helm 3.14+) to let helm adopt the existing objects. Once adopted, value changes are applied on upgrade and the objects are removed on helm uninstall.
    type: boolean
    default: false
    group: Advanced
  - variable: ingress.entryPoints.ssh
    label: SSH Traefik EntryPoint
    description: entrypoint name for ssh port
    type: string
    default: ssh
    group: Advanced
    show_if: gateway.enable=false
  - variable: ingress.entryPoints.saltPublish
    label: Salt Publish Traefik EntryPoint
    description: entrypoint name for salt's publish port
    type: string
    default: salt-publish
    group: Advanced
    show_if: gateway.enable=false
  - variable: ingress.entryPoints.saltRequest
    label: Salt Request Traefik EntryPoint
    description: entrypoint name for salt's request port
    type: string
    default: salt-request
    group: Advanced
    show_if: gateway.enable=false
