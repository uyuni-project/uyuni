{{- $services := .Values.services | default (dict) -}}
{{- $servicesType := $services.type | default "ClusterIP" -}}
{{- $servicesSalt := $services.salt | default (dict) -}}
{{- $servicesSsh := $services.ssh | default (dict) -}}
{{- $servicesTftp := $services.tftp | default (dict) -}}
{{- $saltPorts := $servicesSalt.ports | default (dict) -}}
{{- $tftp := .Values.tftp | default (dict) }}

apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: uyuni
spec:
  selector:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: uyuni
  type: ClusterIP
  ports:
    - name: http
      port: 80
    - name: https
      port: 443
---
apiVersion: v1
kind: Service
metadata:
  name: salt
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: uyuni
{{- if or $services.annotations $servicesSalt.annotations }}
  annotations:
{{ toYaml ( mergeOverwrite (dict) (default (dict) $services.annotations) (default (dict) $servicesSalt.annotations) ) | indent 4 }}
{{- end }}
spec:
  selector:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: uyuni
  type: {{ $servicesSalt.type | default $servicesType }}
  ports:
    - name: publish
      port: 4505
{{- if eq (default $servicesType $servicesSalt.type) "NodePort" }}
      nodePort: {{ $saltPorts.publish | default 30005 }}
{{- end }}
    - name: request
      port: 4506
{{- if eq (default $servicesType $servicesSalt.type) "NodePort" }}
      nodePort: {{ $saltPorts.request  | default 30006 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: ssh
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: uyuni
{{- if or $services.annotations $servicesSsh.annotations }}
  annotations:
{{ toYaml ( mergeOverwrite (dict) (default (dict) $services.annotations) (default (dict) $servicesSsh.annotations) ) | indent 4 }}
{{- end }}
spec:
  selector:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: uyuni
  type: {{ $servicesSsh.type | default $servicesType }}
  ports:
    - name: ssh
      port: 8022
      targetPort: 22
{{- if eq (default $servicesType $servicesSsh.type) "NodePort" }}
      nodePort: {{ ($servicesSsh.ports | default (dict)).ssh | default 30022 }}
{{- end }}
{{- if not $tftp.hostNetwork }}
---
apiVersion: v1
kind: Service
metadata:
  name: tftp
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: uyuni
{{- if or $services.annotations $servicesTftp.annotations }}
  annotations:
{{ toYaml ( mergeOverwrite (dict) (default (dict) $services.annotations) (default (dict) $servicesTftp.annotations) ) | indent 4 }}
{{- end }}
spec:
  selector:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: uyuni
  # ClusterIP or NodePort wouldn't work for TFTP if not using the host network
  type: LoadBalancer
  # Ensures all packets from a single client go to the same pod
  sessionAffinity: ClientIP
  # Preserves the client's source IP and avoids extra hops between nodes
  externalTrafficPolicy: Local
  ports:
    - name: tftp
      port: 69
      protocol: UDP
{{- end }}
