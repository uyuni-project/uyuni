# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test null values in routes
templates:
  - routes.yaml
set:
  global.fqdn: uyuni.example.com
tests:
  - it: should not render routes when gateway is null
    set:
      gateway: null
    asserts:
      - hasDocuments:
          count: 0

  - it: should use the default gateway and listener names when null
    set:
      gateway.enable: true
      gateway.name: null
      gateway.listeners: null
    asserts:
      - equal:
          path: spec.parentRefs[0]
          value:
            name: uyuni-gateway
            sectionName: web
        documentSelector:
          path: metadata.name
          value: uyuni-ssl-redirect
      - equal:
          path: spec.parentRefs[0]
          value:
            name: uyuni-gateway
            sectionName: websecure
        documentSelector:
          path: metadata.name
          value: uyuni-https-routes
      - equal:
          path: spec.parentRefs[0]
          value:
            name: uyuni-gateway
            sectionName: web
        documentSelector:
          path: metadata.name
          value: uyuni-nossl-routes

  - it: should skip the optional component routes when they are null
    set:
      gateway.enable: true
      saline: null
      hubAPI: null
    asserts:
      - notContains:
          path: spec.rules
          content:
            backendRefs:
              - name: saline
          any: true
        documentSelector:
          path: metadata.name
          value: uyuni-https-routes
      - notContains:
          path: spec.rules
          content:
            backendRefs:
              - name: hub-xmlrpc
          any: true
        documentSelector:
          path: metadata.name
          value: uyuni-https-routes

