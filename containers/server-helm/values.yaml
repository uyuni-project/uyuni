# @schema
# repository -- The default repository with the path where to find all the images.
repository: registry.opensuse.org/uyuni

# tag -- The default tag to use for all the images, can be overridden
# By default the tag will be the appVersion of the Chart.
tag:

# @schema
# enum: ["Always", "IfNotPresent", "Never"]
# @schema
# pullPolicy -- Images pull policy. See: https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy
pullPolicy: "IfNotPresent"

# registrySecret -- name of secret to use to pull the images from the
# registry with authentication. Leave empty for no authentication.
# To create the secret, see:
# https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
registrySecret: ""

# @schema
# required: true
# @schema
# global -- Variables that can be shared with a parent chart
global:
  # @default `nil`
  # @schema
  # required: true
  # @schema
  # global.fqdn -- Fully qualified name the server will answer as.
  fqdn: null

# timezone -- The time zone to set in the containers
timezone: "Etc/UTC"

# @default `{}`
# @schema
# $ref: "#/definitions/nodeSelectorConfig"
# @schema
# placement -- Default node placement rules for all pods
placement: {}

# server -- Server component configuration
server:
  # @default `nil`
  # @schema
  # type: ["string", "null"]
  # @schema
  # server.image -- Overrides the default image computed using the repository property. Leave undefined to use the default
  image: null

  # @default `nil`
  # @schema
  # type: ["string", "null"]
  # @schema
  # server.tag -- Overrides the default tag in the tag property. Leave undefined to use the default
  tag: null

  # server.email -- Email used for the notifications sent by the server.
  email: "admin@uyuni.lab.org"

  # server.sccSecret -- Name of a basic-auth secret with the organization mirroring credentials to set up on the server.
  sccSecret: ""

  # server.mirror -- Volume or host path to mount in the container as server.susemanager.fromdir value.
  mirror:
    # server.mirror.claimName -- Name of the PVC to use for the mirror volume.
    claimName: ""
    # server.mirror.hostPath -- Path on the node to mount as mirror.
    hostPath: ""

  # @schema
  # type: ["array", "null"]
  # items: {type: "object"}
  # @schema
  # server.extraVolumes -- Additional Kubernetes volumes for the server pod.
  extraVolumes: []

  # @schema
  # type: ["array", "null"]
  # items: {type: "object"}
  # @schema
  # server.extraVolumeMounts -- Additional mounts for the server container.
  extraVolumeMounts: []

  # @schema
  # type: "boolean"
  # default: "false"
  # @schema
  # server.superPrivileged -- Set to true to run on a cluster with selinux or AppArmor enforced.
  superPrivileged: false

  # @schema
  # enum: ["debug", "info", "notice", "warning", "err", "crit", "alert", "emerg", ""]
  # @schema
  # server.systemdLogLevel -- Systemd log level to use for debugging
  systemdLogLevel: ""

  # server.apparmorProfile -- Name of an AppArmor profile to use for the server pod.
  apparmorProfile: ""

  # server.selinuxType -- Name of the SELinux type to use for the server pod.
  selinuxType: ""

  # @schema
  # $ref: "#/definitions/nodeSelectorMap"
  # @schema
  # server.nodeSelector -- Node label matching rules.
  nodeSelector: {}

  # @schema
  # $ref: "#/definitions/affinityConfig"
  # @schema
  # server.affinity -- Advanced scheduling rules.
  affinity: {}

  # @schema
  # $ref: "#/definitions/tolerationsList"
  # @schema
  # server.tolerations -- Node taint tolerations.
  tolerations: []

  # @schema
  # type: ["string", "null"]
  # @schema
  # server.nodeName -- Specific node assignment.
  nodeName:


#services -- Services tuning properties.
services:

  # @schema
  # enum: ["ClusterIP", "NodePort", "LoadBalancer"]
  # @schema
  # services.type -- type of all the externally-facing services. Can be overridden on each service.
  type: ClusterIP

  # @default `nil`
  # @schema
  # type: ["object", "null"]
  # @schema
  # services.annotations -- annotations to set to all the services. Merged with the service ones.
  annotations: null

  # @schema
  # $ref: "#/definitions/serviceConfig"
  # @schema
  # services.reportdb -- Values setting up the reportdb service.
  reportdb:
    type: ""
    ports:
      # -- Port to use as a NodePort service
      pgsql: 30032
    # @default `nil`
    annotations: null

  # @schema
  # $ref: "#/definitions/serviceConfig"
  # @schema
  # services.salt -- Values setting up the salt service.
  salt:
    type: ""
    ports:
      # -- Port to use as a NodePort service
      publish: 30005
      # -- Port to use as a NodePort service
      request: 30006
    # @default `nil`
    annotations: null

  # @schema
  # $ref: "#/definitions/serviceConfig"
  # @schema
  # services.search -- Values setting up the search server service.
  search:
    type: ""
    ports:
      # -- Port to use as a NodePort service
      debug: 30002
    # @default `nil`
    annotations: null

  # @schema
  # $ref: "#/definitions/serviceConfig"
  # @schema
  # services.taskomatic -- Values setting up the taskomatic service.
  taskomatic:
    type: ""
    ports:
      # -- Port to use as a NodePort service
      debug: 30001
    # @default `nil`
    annotations: null

  # @schema
  # $ref: "#/definitions/serviceConfig"
  # @schema
  # services.tomcat -- Values setting up the tomcat service.
  tomcat:
    type: ""
    ports:
      # -- Port to use as a NodePort service
      debug: 30003
    # @default `nil`
    annotations: null

  # @schema
  # type: ["object", "null"]
  # @schema
  # services.tftp -- Values setting up the tftp service.
  tftp:
    # @default `nil`
    # @schema
    # type: ["object", "null"]
    # @schema
    annotations: null

# @schema
# type: "boolean"
# default: "false"
# @schema
# exposeJavaDebug -- Expose ports 8001, 8002, and 8003 for Java debugging if true
exposeJavaDebug: false

# @schema
# type: "boolean"
# default: "true"
# @schema
# enableMonitoring -- Create the ingress or gateway routes for Prometheus exporters if true.
enableMonitoring: true

# ingress -- Configuration of the ingress rules. Won't be used if gateway is enabled.
ingress:
  # @schema
  # enum: ["traefik", ""]
  # @schema
  # ingress.type -- Ingress that is used in the cluster.
  # Set to the empty string to use a custom ingress.
  type: "traefik"

  # ingress.class -- Specify the ingress class name to use.
  class: "traefik"

  # ingress.annotations -- Custom annotations for ingress rules.
  annotations:
    # @schema
    # $ref: "#/definitions/annotationsMap"
    # @schema
    # ingress.annotations.ssl -- annotations for the uyuni-ingress-ssl ingress definition.
    ssl: {}
    # @schema
    # $ref: "#/definitions/annotationsMap"
    # @schema
    # ingress.annotations.sslRedirect -- annotations for the uyuni-ingress-ssl-redirect ingress definition.
    sslRedirect: {}
    # @schema
    # $ref: "#/definitions/annotationsMap"
    # @schema
    # ingress.annotations.nossl -- annotations for the uyuni-ingress-nossl ingress definition.
    nossl: {}
    # @schema
    # $ref: "#/definitions/annotationsMap"
    # @schema
    # ingress.annotations.saline -- annotations for the saline-ingress-ssl ingress definition.
    saline: {}
    # @schema
    # $ref: "#/definitions/annotationsMap"
    # @schema
    # ingress.annotations.hub -- annotations for the hubapi-ingress-ssl ingress definition.
    hub: {}
    # @schema
    # $ref: "#/definitions/annotationsMap"
    # @schema
    # ingress.annotations.exporters -- annotations for the exporters-ingress-ssl ingress definition.
    exporters: {}

# gateway -- Configures the Gateway API.
gateway:
  # @schema
  # type: "boolean"
  # default: "false"
  # @schema
  # gateway.enable -- If enabled, Gateway API 1.4 resources will be deployed instead of the ingress ones.
  # Note that TCPRoute is used and is still in alpha2 stage.
  enable: false
  # gateway.class -- Name of the gateway class to use. For rke2 with traefik, it is likely to be "traefik".
  class: ""
  # gateway.name -- Name of the Gateway to use. If left empty an uyuni-gateway will be created.
  name: ""

  # gateway.listeners -- Gateway listeners configuration
  listeners:
    # @schema
    # $ref: "#/definitions/listener"
    # @schema
    # gateway.listeners.http -- Configuration of the HTTP listener.
    # The default is adjusted for traefik on rke2
    http:
      # gateway.listeners.http.name -- Name of the HTTP listener in the Gateway.
      name: "web"
      # gateway.listeners.http.port -- Port of the HTTP listener to set in the Gateway.
      port: 8000

    # @schema
    # $ref: "#/definitions/listener"
    # @schema
    # gateway.listeners.https -- Configuration of the HTTPS listener.
    # The default is adjusted for traefik on rke2
    https:
      # gateway.listeners.https.name -- Name of the HTTPS listener in the Gateway.
      name: "websecure"
      # gateway.listeners.https.port -- Port of the HTTPS listener to set in the Gateway.
      port: 8443

# tftp -- TFTP server configuration
tftp:
  # @default `nil`
  # @schema
  # type: ["string", "null"]
  # @schema
  # tftp.image -- Image for the TFTP server container, overwriting the one computed with the `repository` value
  image: null

  # @default `nil`
  # @schema
  # type: ["string", "null"]
  # @schema
  # tftp.tag -- Tag for the TFTP server container, overwriting the global one
  tag: null

  # @schema
  # type: "boolean"
  # default: "false"
  # @schema
  # tftp.enable -- Define a TFTP server deployment with one replica if set to true
  enable: false

  # @schema
  # type: "boolean"
  # default: "false"
  # @schema
  # tftp.hostNetwork -- Use the host network to bypass the Kubernetes network layers.
  # This may be needed if not using a LoadBalancer for the TFTP server.
  # Note that this may be more complex to manage on multi-node clusters.
  hostNetwork: false
  
  # @schema
  # $ref: "#/definitions/nodeSelectorMap"
  # @schema
  # tftp.nodeSelector -- Node label matching rules.
  nodeSelector: {}

  # @schema
  # $ref: "#/definitions/affinityConfig"
  # @schema
  # tftp.affinity -- Advanced scheduling rules.
  affinity: {}

  # @schema
  # $ref: "#/definitions/tolerationsList"
  # @schema
  # tftp.tolerations -- Node taint tolerations.
  tolerations: []

  # @schema
  # type: ["string", "null"]
  # @schema
  # tftp.nodeName -- Specific node assignment.
  nodeName:

