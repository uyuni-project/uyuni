# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test null values in traefik-routes
templates:
  - traefik-routes.yaml
set:
  global.fqdn: uyuni.example.com
  exposeJavaDebug: true
tests:
  - it: should render all TCP routes when gateway and services are null
    set:
      gateway: null
      services: null
    asserts:
      - hasDocuments:
          count: 7

  - it: should not render traefik routes when ingress is null
    set:
      ingress: null
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render traefik routes when ingress.type is null
    set:
      ingress.type: null
    asserts:
      - hasDocuments:
          count: 0

