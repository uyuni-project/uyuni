{{- $config := .Values.global.config | fromYaml }}
{{- $squid := (.Values.volumes | default (dict)).squid | default (dict) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: squid-cache
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: uyuni
{{- if $squid.extraLabels }}
{{ toYaml $squid.extraLabels | nindent 4 }}
{{- end }}
{{- if $squid.annotations }}
  annotations:
{{ toYaml $squid.annotations | nindent 4 }}
{{- end }}
spec:
{{- if $squid.storageClass }}
  {{- if eq "-" $squid.storageClass }}
  storageClassName: ""
  {{- else }}
  storageClassName: {{ $squid.storageClass | quote }}
  {{- end }}
{{- end }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "{{ $config.max_cache_size_mb }}Mi"
{{- if $squid.volumeName }}
  volumeName: {{ $squid.volumeName | quote }}
{{- end }}
{{- if $squid.selector }}
  selector:
{{ toYaml $squid.selector | nindent 4 }}
{{- end }}
