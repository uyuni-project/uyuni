#         $ref: "#/definitions/nodeSelectorMap"
#       affinity:
#         $ref: "#/definitions/affinityConfig"
#       tolerations:
#         $ref: "#/definitions/tolerationsList"
#       nodeName:
#         type: ["string", "null"]
#         description: "Specific node assignment."
#   dbConnectionConfig:
#     type: ["object", "null"]
#     properties:
#       host:
#         type: ["string", "null"]
#         description: "FQDN to use to connect to the database"
#       port:
#         type: ["integer", "null"]
#         description: "port to use to connect to the database"
#         default: 5432
#       name:
#         type: ["string", "null"]
#         description: "Postgresql database name to connect to"
#   volumeConfig:
#     type: "object"
#     properties:
#       size:
#         type: "string"
#         description: "Requested volume size"
#       storageClass:
#         type: ["string", "null"]
#         description: "storage class to use for the volume claim"
#       extraLabels:
#         type: ["object", "null"]
