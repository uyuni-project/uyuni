name: ShellCheck

on:
  pull_request:
    paths:
      - '.github/workflows/shellcheck.yml'
      - 'testsuite/features/upload_files/**/*.sh'

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0
    - name: Run ShellCheck
      run: find testsuite/features/upload_files -name '*.sh' -print0 | xargs -0 shellcheck -S warning
