# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test null values in optional components
templates:
  - coco.yaml
  - hub.yaml
  - saline.yaml
  - tftp.yaml
  - db.yaml
set:
  global.fqdn: uyuni.example.com
tests:
  - it: should disable optional components when their configuration is null
    set:
      coco: null
      hubAPI: null
      saline: null
      tftp: null
      db: null
    asserts:
      - hasDocuments:
          count: 0

  - it: should use the default images when image and tag are null
    set:
      coco: {replicas: 1, image: null, tag: null}
      hubAPI: {enable: true, image: null, tag: null}
      saline: {enable: true, image: null, tag: null}
      tftp: {enable: true, image: null, tag: null}
      db: {enable: true, image: null, tag: null}
      tag: null
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.opensuse.org/uyuni/server-attestation:0.0.0
        template: coco.yaml
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.opensuse.org/uyuni/server-hub-xmlrpc-api:0.0.0
        template: hub.yaml
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.opensuse.org/uyuni/server-saline:0.0.0
        template: saline.yaml
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.opensuse.org/uyuni/proxy-tftpd:0.0.0
        template: tftp.yaml
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.opensuse.org/uyuni/server-postgresql:0.0.0
        template: db.yaml

  - it: should not use the host network when tftp.hostNetwork is null
    set:
      tftp: {enable: true, hostNetwork: null}
    asserts:
      - notExists:
          path: spec.template.spec.hostNetwork
        template: tftp.yaml

