{{- $server := .Values.server | default (dict) -}}
{{- $db := .Values.db | default (dict) -}}
{{- $internalDb := $db.internal | default (dict) -}}
{{- $reportDb := $db.report | default (dict) }}
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/part-of: uyuni
  name: uyuni-config
  namespace: "{{ .Release.Namespace }}"
data:
  fqdn: {{ required "global.fqdn is needed!" .Values.global.fqdn }}
  email: {{ required "server.email is needed!" $server.email }}
  {{- if $db.enable }}
  db_host: db
  db_port: "5432"
  db_name: "susemanager"
  reportdb_host: reportdb
  reportdb_port: "5432"
  reportdb_name: reportdb
  {{- else }}
  db_host: {{ $internalDb.host | default "db" }}
  db_port: "{{ $internalDb.port | default 5432 }}"
  db_name: {{ $internalDb.name | default "susemanager" }}
  reportdb_host: {{ $reportDb.host | default "reportdb" }}
  reportdb_port: "{{ $reportDb.port | default 5432 }}"
  reportdb_name: {{ $reportDb.name | default "reportdb" }}
  {{- end }}
