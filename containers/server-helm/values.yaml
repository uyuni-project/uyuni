# db -- PostgreSQL database configuration
db:
  # @default `nil`
  # @schema
  # type: ["string", "null"]
  # @schema
  # db.image -- Image for the database container, overwriting the one computed with the `repository` value
  image: null

  # @default `nil`
  # @schema
  # type: ["string", "null"]
  # @schema
  # db.tag -- Image tag for the database container, overwriting the global one
  tag: null

  # @schema
  # type: "boolean"
  # default: "false"
  # @schema
  # db.enable -- Deploys the internal dababase if set to true. Setting to false is not supported yet.
  enable: true

  # db.podsCIDR -- Network IP range to allow plain text connections from, usually the cluster pods CIDR
  # The default has been adjusted with rke2's pods CIDR default.
  podsCIDR: 10.42.0.0/16

  # @schema
  # $ref: "#/definitions/dbConnectionConfig"
  # @schema
  # db.internal -- Configuration of the internal database connection
  internal:
    # @default `nil`
    # @schema
    # type: ["string", "null"]
    # @schema
    # db.internal.host -- FQDN or IP where to find the internal database (unused for now)
    host: null

    # db.internal.port -- Port where to find the internal database (unused for now)
    port: 5432

    # @default `nil`
    # @schema
    # type: ["string", "null"]
    # @schema
    # db.internal.name -- Name of the internal database (unused for now)
    name: null

  # @schema
  # $ref: "#/definitions/dbConnectionConfig"
  # @schema
  # db.report -- Configuration of the report database connection
  report:
    # @default `nil`
    # @schema
    # type: ["string", "null"]
    # @schema
    # db.report.host -- FQDN or IP where to find the report database (unused for now)
    host: null

    # db.report.port -- Port where to find the report database (unused for now)
    port: 5432

    # @default `nil`
    # @schema
    # type: ["string", "null"]
    # @schema
    # db.report.name -- Name of the report database (unused for now)
    name: null
  
  # @schema
  # $ref: "#/definitions/nodeSelectorMap"
  # @schema
  # db.nodeSelector -- Node label matching rules.
  nodeSelector: {}

  # @schema
  # $ref: "#/definitions/affinityConfig"
  # @schema
  # db.affinity -- Advanced scheduling rules.
  affinity: {}

  # @schema
  # $ref: "#/definitions/tolerationsList"
  # @schema
  # db.tolerations -- Node taint tolerations.
  tolerations: []

  # @schema
  # type: ["string", "null"]
  # @schema
  # db.nodeName -- Specific node assignment.
  nodeName:


# volumes -- Configuration of persistent volume claims.
volumes:
