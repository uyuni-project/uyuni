# Minimum username length
java.min_user_len = 5

# is this system in a development environment?
java.development_environment = 0

# the version of API
java.apiversion = 29

# Puts the LocalizationService into debug mode so all the
# messages in the web UI will show up with a marker around them to indicate they
# have been externalized with calls to fetch their translated resource.
java.l10n_debug=false
java.l10n_debug_marker=$$$
java.l10n_missingmessage_exceptions=false

# List of supported locales
# NOTE: for the RPMs this is defined at the SPEC!
java.supported_locales=bn_IN,ca,de,en_US,es,fr,gu,hi,it,ja,ko,pa,pt,pt_BR,ru,ta,zh_CN,zh_TW

# List of countries to exclude for new user creation
# This is currently: Cuba,Iran,Iraq,North Korea,Sudan,Syria
java.excluded_countries=CU,IR,IQ,KP,SD,SY

# default values for system currency multipliers
# needed by spacewalk-report for system currency report

# multiplier for critical security errata
java.sc_crit = 32

# multiplier for important security errata
java.sc_imp = 16

# multiplier for moderate important security errata
java.sc_mod = 8

# multiplier for low important security errata
java.sc_low = 4

# multiplier for bugfix errra
java.sc_bug = 2

# multiplier for ehnancement errata
java.sc_enh = 1

# how many workers should generate channels metadata concurently
java.taskomatic_channel_repodata_workers = 2

# how many workers should generate CLM differences
java.taskomatic_clmdiff_workers = 2

# The vendor name
java.vendor_name = SUSE

# The Enterprise Linux product name
java.enterprise_linux_name = SUSE Linux Enterprise

# The vendor service name
java.vendor_service_name = SUSE Customer Center

# Hostname/IP of an SMTP server for sending notifications and traceback
# alerts to Uyuni users
java.smtp_server = localhost

# Port of the SMTP server to use
java.smtp_port = 25

# SMTP server require authentication
java.smtp_auth = 0

# SMTP server should do SSL
java.smtp_ssl = 0

# SMTP server support STARTTLS
java.smtp_starttls = 0

# SMTP username to authenticate with
java.smtp_user =

# SMTP password to authenticate with
java.smtp_pass =

# TLS protocols allowed when sending mail over SMTP/STARTTLS. Comma-separated.
# Override only if an SMTP relay requires legacy protocols (e.g. TLSv1.1) — this
# opts out of a compliance requirement.
java.smtp_tls_protocols = TLSv1.2,TLSv1.3

# Size of the thread pool used for the message queue
java.message_queue_thread_pool_size = 5

# Unify management of custom and vendor channels.
# When true, custom channels are synced automatically after creation and scheduled together with vendor channels
# Otherwise, any synchronization on custom channel must be issued manually
java.unify_custom_channel_management = true

# Number of threads dedicated to processing Salt events
java.salt_event_thread_pool_size = 8

# Maximum number of events processed before COMMITTing to the database.
# Each thread in the pool as defined by salt_event_thread_pool_size will process up to salt_events_per_commit
# events before COMMITTing to the database and return to the pool for further work.
#
# Raising this to any value above 1 will decrease reliability: in case of failure multiple events
# will be lost. On the other hand, this can reduce the overall number of COMMIT operation thus improving
# performance in high-scale scenarios.
java.salt_events_per_commit = 1

# Interval in milliseconds at which the Salt event notification system checks for new events to process.
# Lower values will typically result in faster processing of Salt events but can increase CPU load on the server.
java.salt_event_notification_poll_interval_ms = 100

# Interval in seconds at which the connection watchdog checks database health and recovers orphaned events.
# The watchdog ensures database connectivity and reschedules any events that lost their notifications.
java.salt_event_connection_watchdog_interval_seconds = 5

# If true, Tomcat and Taskomatic will expose Prometheus endpoints
# Tomcat: http://localhost/rhn/metrics/
# Taskomatic: http://localhost:9800/
prometheus_monitoring_enabled = false

# salt-api endpoints
java.salt_api_host = localhost
java.salt_api_port = 9080

# Maximal number of parallel connections to refresh from SCC
java.mgr_sync_max_connections = 4

# Determins which product tree variation to use.
java.product_tree_tag = SUMA5.2

# If true, login is enabled via Single Sign-On (SSO)
java.sso = false

# HTTP Connection Timeout in seconds
java.http_connection_timeout = 5

# HTTP Socket Timeout in seconds
java.http_socket_timeout = 300

# HTTP Socket Timeout in seconds for salt-api connections (12 hours)
java.salt_api_http_socket_timeout = 43200

# TLS protocols allowed for outbound HTTPS from the Uyuni HTTP client.
# Comma-separated. Override only if an upstream endpoint requires legacy
# protocols (e.g. TLSv1.1) — this opts out of a compliance requirement.
java.http_client_tls_protocols = TLSv1.2,TLSv1.3

# Allow adding patch (errata) information via the API for the specified vendor channels. This is provided as convenience
# option to allow third-party scripts to change vendor information, but please note any channel in this list, once this
# option is enabled, cannot be supported by the vendor. Please check the documentation for more information.
#java.allow_adding_patches_via_api = centos6-x86_64,centos7-x86_64,centos8-x86_64

# Maximum number of actions targetting Salt SSH minions executing at the same time
taskomatic.sshminion_action_executor.parallel_threads = 20

# minimal required DB schema version
java.min_schema_version = 5.2.13

# minimal required DB reporting schema version
java.min_report_schema_version = 5.2.3

