# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test null values in services
templates:
  - templates/services.yaml
set:
  global.config: |
    max_cache_size_mb: 2048
    server: parent.example.org
    proxy_fqdn: proxy.example.org
    email: foo@example.org
  global.httpd: "httpd_content: test httpd"
  global.ssh: "ssh_content: test ssh"
tests:
  - it: should default to ClusterIP services when services is null
    set:
      services: null
      tftp: null
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
        documentSelector:
          path: metadata.name
          value: salt
      - equal:
          path: spec.type
          value: ClusterIP
        documentSelector:
          path: metadata.name
          value: ssh
      - notExists:
          path: metadata.annotations
        documentSelector:
          path: metadata.name
          value: tftp

  - it: should fall back to the default node ports when the ports are null
    set:
      services:
        type: NodePort
        salt: {ports: null}
        ssh: {ports: null}
    asserts:
      - equal:
          path: spec.ports[?(@.name=="publish")].nodePort
          value: 30005
        documentSelector:
          path: metadata.name
          value: salt
      - equal:
          path: spec.ports[?(@.name=="request")].nodePort
          value: 30006
        documentSelector:
          path: metadata.name
          value: salt
      - equal:
          path: spec.ports[0].nodePort
          value: 30022
        documentSelector:
          path: metadata.name
          value: ssh

  - it: should use the global type and annotations when per-service entries are null
    set:
      services:
        type: LoadBalancer
        annotations:
          foo: bar
        salt: null
        ssh: null
        tftp: null
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
        documentSelector:
          path: metadata.name
          value: salt
      - equal:
          path: spec.type
          value: LoadBalancer
        documentSelector:
          path: metadata.name
          value: ssh
      - equal:
          path: metadata.annotations
          value:
            foo: bar
        documentSelector:
          path: metadata.name
          value: tftp

