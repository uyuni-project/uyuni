# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test null values in deployments
templates:
  - templates/deployment.yaml
  - templates/tftp.yaml
set:
  global.config: |
    max_cache_size_mb: 2048
    server: parent.example.org
    proxy_fqdn: proxy.example.org
    email: foo@example.org
  global.httpd: "httpd_content: test httpd"
  global.ssh: "ssh_content: test ssh"
tests:
  - it: should use the default images when the components are null
    set:
      httpd: null
      squid: null
      ssh: null
      salt: null
      tftp: null
      tag: null
      placement: null
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=="httpd")].image
          value: registry.opensuse.org/uyuni/proxy-httpd:0.0.0
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.containers[?(@.name=="squid")].image
          value: registry.opensuse.org/uyuni/proxy-squid:0.0.0
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.containers[?(@.name=="ssh")].image
          value: registry.opensuse.org/uyuni/proxy-ssh:0.0.0
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.containers[?(@.name=="salt-broker")].image
          value: registry.opensuse.org/uyuni/proxy-salt-broker:0.0.0
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.opensuse.org/uyuni/proxy-tftpd:0.0.0
        template: templates/tftp.yaml
      - notExists:
          path: spec.template.spec.hostNetwork
        template: templates/tftp.yaml
      - notExists:
          path: spec.strategy
        template: templates/tftp.yaml

  - it: should use the default images when image and tag are null
    set:
      httpd: {image: null, tag: null}
      tftp: {image: null, tag: null}
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=="httpd")].image
          value: registry.opensuse.org/uyuni/proxy-httpd:0.0.0
        template: templates/deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.opensuse.org/uyuni/proxy-tftpd:0.0.0
        template: templates/tftp.yaml

