httpd:
  # @default `nil`
  # @schema
  # type: ["string", "null"]
  # @schema
  # httpd.image -- Image for the Apache server container, overwriting the one computed with the `repository` value
  image:

  # @default `nil`
  # @schema
  # type: ["string", "null"]
  # @schema
  # httpd.tag -- Tag for the Apache server container, overwriting the global one
  tag:

  # @schema
  # type: ["string", "null"]
  # @schema
  # httpd.tuning -- Custom configuration for the apache server
  tuning: ""
  
  # @schema
  # $ref: "#/definitions/nodeSelectorMap"
  # @schema
  # httpd.nodeSelector -- Node label matching rules.
  nodeSelector: {}

  # @schema
  # $ref: "#/definitions/affinityConfig"
  # @schema
  # httpd.affinity -- Advanced scheduling rules.
  affinity: {}

  # @schema
  # $ref: "#/definitions/tolerationsList"
  # @schema
  # httpd.tolerations -- Node taint tolerations.
  tolerations: []

  # @schema
  # type: ["string", "null"]
  # @schema
  # httpd.nodeName -- Specific node assignment.
  nodeName:


