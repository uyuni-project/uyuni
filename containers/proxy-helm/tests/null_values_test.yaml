# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test null values in ingress
templates:
  - templates/ingress.yaml
set:
  global.config: |
    max_cache_size_mb: 2048
    server: parent.example.org
    proxy_fqdn: proxy.example.org
    email: foo@example.org
  global.httpd: "httpd_content: test httpd"
  global.ssh: "ssh_content: test ssh"
tests:
  - it: should render a generic ingress when gateway and ingress are null
    set:
      gateway: null
      ingress: null
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: spec.ingressClassName
      - isNullOrEmpty:
          path: metadata.annotations

  - it: should keep the traefik annotations when ingress.annotations is null
    set:
      ingress.annotations: null
    asserts:
      - equal:
          path: metadata.annotations["traefik.ingress.kubernetes.io/router.tls"]
          value: "true"

