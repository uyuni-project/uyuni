# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test null values in persistent volume claims
templates:
  - pvcs.yaml
set:
  global.fqdn: uyuni.example.com
tests:
  - it: should use the default sizes when volumes is null
    set:
      volumes: null
    asserts:
      - hasDocuments:
          count: 25
      - notExists:
          path: spec.storageClassName
      - equal:
          path: spec.resources.requests.storage
          value: 100Gi
        documentSelector:
          path: metadata.name
          value: srv-www
      - equal:
          path: spec.resources.requests.storage
          value: 50Gi
        documentSelector:
          path: metadata.name
          value: var-pgsql18

  - it: should use the global storage class when a volume entry is null
    set:
      volumes:
        storageClass: fast
        var-pgsql: null
    asserts:
      - equal:
          path: spec.storageClassName
          value: fast
        documentSelector:
          path: metadata.name
          value: var-pgsql18
      - equal:
          path: spec.resources.requests.storage
          value: 50Gi
        documentSelector:
          path: metadata.name
          value: var-pgsql18

  - it: should use the defaults when the volume fields are null
    set:
      volumes:
        var-pgsql:
          size: null
          storageClass: null
          extraLabels: null
          annotations: null
          volumeName: null
          selector: null
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 50Gi
        documentSelector:
          path: metadata.name
          value: var-pgsql18
      - notExists:
          path: spec.volumeName
        documentSelector:
          path: metadata.name
          value: var-pgsql18
      - notExists:
          path: metadata.annotations
        documentSelector:
          path: metadata.name
          value: var-pgsql18
