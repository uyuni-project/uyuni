# @schema
# @schema
# x-rancher-question:
#   label: Image Repository
#   group: Images
#   order: 200
#   required: true
# @schema
# repository -- The default repository with the path where to find all the images.
repository: registry.opensuse.org/uyuni

# @schema
# x-rancher-question:
#   label: Image Tag
#   group: Images
#   order: 210
#   description: Default tag to use for all images. Leave empty to use the chart appVersion.
# @schema
# tag -- The default tag to use for all the images, can be overridden
# By default the tag will be the appVersion of the Chart.
tag:

# @schema
# enum: ["Always", "IfNotPresent", "Never"]
# x-rancher-question:
#   label: Image Pull Policy
#   group: Images
#   order: 220
# @schema
# pullPolicy -- Images pull policy. See: https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy
pullPolicy: "IfNotPresent"

# @schema
# x-rancher-question:
#   label: Registry Pull Secret
#   group: Images
#   order: 230
#   type: secret
#   description: "Name of the secret used to pull the images from a registry with authentication. Leave empty for no authentication. Once selected, it can only be cleared by editing the values YAML."
# @schema
# registrySecret -- name of secret to use to pull the images from the
# registry with authentication. Leave empty for no authentication.
# To create the secret, see:
# https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
registrySecret: ""

# @schema
# required: true
# @schema
# global -- Variables that can be shared with a parent chart
global:
  # @default `nil`
  # @schema
  # required: true
  # x-rancher-question:
  #   label: Server FQDN
  #   group: General
  #   order: 100
  #   type: string
  #   required: true
  #   description: Fully qualified domain name the server will answer as, e.g. uyuni.example.com. Changing this value later renames the server, handle with care.
  # @schema
  # global.fqdn -- Fully qualified name the server will answer as.
  fqdn: null

# @schema
# x-rancher-question:
#   label: Time Zone
#   group: General
#   order: 120
# @schema
# timezone -- The time zone to set in the containers
timezone: "Etc/UTC"

# @default `{}`
# @schema
# $ref: "#/definitions/nodeSelectorConfig"
# @schema
# placement -- Default node placement rules for all pods
placement: {}

# server -- Server component configuration
server:
  # @default `nil`
  # @schema
  # type: ["string", "null"]
  # @schema
  # server.image -- Overrides the default image computed using the repository property. Leave undefined to use the default
  image: null

  # @default `nil`
  # @schema
  # type: ["string", "null"]
  # @schema
  # server.tag -- Overrides the default tag in the tag property. Leave undefined to use the default
  tag: null

  # @schema
  # x-rancher-question:
  #   label: Notification Email
  #   group: General
  #   order: 110
  # @schema
  # server.email -- Email used for the notifications sent by the server.
  email: "admin@uyuni.lab.org"

  # @schema
  # x-rancher-question:
  #   label: SCC Credentials Secret
  #   group: General
  #   order: 130
  #   type: secret
  #   description: Name of a basic-auth secret with the organization mirroring credentials to set up on the server. Leave empty for none. Once selected, it can only be cleared by editing the values YAML.
  # @schema
  # server.sccSecret -- Name of a basic-auth secret with the organization mirroring credentials to set up on the server.
  sccSecret: ""

  # server.mirror -- Volume or host path to mount in the container as server.susemanager.fromdir value.
  mirror:
    # @schema
    # x-rancher-question:
    #   label: Mirror Volume Claim
    #   group: Storage
    #   order: 770
    #   type: pvc
    #   description: Existing PVC to mount as the server.susemanager.fromdir mirror. Leave empty for none. Once selected, it can only be cleared by editing the values YAML.
    # @schema
    # server.mirror.claimName -- Name of the PVC to use for the mirror volume.
    claimName: ""
    # @schema
    # x-rancher-question:
    #   label: Mirror Host Path
    #   group: Storage
    #   order: 780
    #   description: Path on the node to mount as the server.susemanager.fromdir mirror. Strongly discouraged as it ties the server to a node. Leave empty for none.
    # @schema
    # server.mirror.hostPath -- Path on the node to mount as mirror.
    hostPath: ""

  # @schema
  # type: ["array", "null"]
  # items: {type: "object"}
  # @schema
  # server.extraVolumes -- Additional Kubernetes volumes for the server pod.
  extraVolumes: []

  # @schema
  # type: ["array", "null"]
  # items: {type: "object"}
  # @schema
  # server.extraVolumeMounts -- Additional mounts for the server container.
  extraVolumeMounts: []

  # @schema
  # type: "boolean"
  # x-rancher-question:
  #   label: Super Privileged Server
  #   group: Advanced
  #   order: 800
  #   description: May be needed on clusters with SELinux or AppArmor enforced. This is a big security risk.
  #   show_subquestion_if: "false"
  # @schema
  # server.superPrivileged -- Set to true to run on a cluster with selinux or AppArmor enforced.
  superPrivileged: false

  # @schema
  # enum: ["debug", "info", "notice", "warning", "err", "crit", "alert", "emerg", ""]
  # x-rancher-question:
  #   label: Systemd Log Level
  #   group: Advanced
  #   order: 830
  #   empty_option_label: Default
  #   description: Value passed to the systemd log-level parameter. Empty keeps the default. Setting it adds a tty to the container.
  # @schema
  # server.systemdLogLevel -- Systemd log level to use for debugging
  systemdLogLevel: ""

  # @schema
  # x-rancher-question:
  #   label: AppArmor Profile
  #   order: 810
  #   subquestion_of: server.superPrivileged
  #   description: Name of an AppArmor profile to use for the server pod. It must show up in aa-status output.
  # @schema
  # server.apparmorProfile -- Name of an AppArmor profile to use for the server pod.
  apparmorProfile: ""

  # @schema
  # x-rancher-question:
  #   label: SELinux Type
  #   order: 820
  #   subquestion_of: server.superPrivileged
  #   description: SELinux type to use for the server pod. Leave empty for the container runtime default.
  # @schema
  # server.selinuxType -- Name of the SELinux type to use for the server pod.
  selinuxType: ""

  # @schema
  # $ref: "#/definitions/nodeSelectorMap"
  # @schema
  # server.nodeSelector -- Node label matching rules.
  nodeSelector: {}

  # @schema
  # $ref: "#/definitions/affinityConfig"
  # @schema
  # server.affinity -- Advanced scheduling rules.
  affinity: {}

  # @schema
  # $ref: "#/definitions/tolerationsList"
  # @schema
  # server.tolerations -- Node taint tolerations.
  tolerations: []

  # @schema
  # type: ["string", "null"]
  # @schema
  # server.nodeName -- Specific node assignment.
  nodeName:


#services -- Services tuning properties.
services:

  # @schema
  # enum: ["ClusterIP", "NodePort", "LoadBalancer"]
  # x-rancher-question:
  #   label: Service Type
  #   group: Services
  #   order: 400
  # @schema
  # services.type -- type of all the externally-facing services. Can be overridden on each service.
  type: ClusterIP

  # @default `nil`
  # @schema
  # type: ["object", "null"]
  # @schema
  # services.annotations -- annotations to set to all the services. Merged with the service ones.
  annotations: null

  # @schema
  # $ref: "#/definitions/serviceConfig"
  # x-rancher-question:
  #   variable: ports.pgsql
  #   label: Report Database NodePort
  #   group: Services
  #   order: 430
  #   description: NodePort exposing the report database PostgreSQL port (5432).
  #   min: 30000
  #   max: 32767
  #   show_if: services.type=NodePort
  # @schema
  # services.reportdb -- Values setting up the reportdb service.
  reportdb:
    type: ""
    ports:
      # -- Port to use as a NodePort service
      pgsql: 30032
    # @default `nil`
    annotations: null

  # @schema
  # $ref: "#/definitions/serviceConfig"
  # x-rancher-question:
  #   - variable: ports.publish
  #     label: Salt Publish NodePort
  #     group: Services
  #     order: 410
  #     description: NodePort exposing the Salt publish port (4505).
  #     min: 30000
  #     max: 32767
  #     show_if: services.type=NodePort
  #   - variable: ports.request
  #     label: Salt Request NodePort
  #     group: Services
  #     order: 420
  #     description: NodePort exposing the Salt request port (4506).
  #     min: 30000
  #     max: 32767
  #     show_if: services.type=NodePort
  # @schema
  # services.salt -- Values setting up the salt service.
  salt:
    type: ""
    ports:
      # -- Port to use as a NodePort service
      publish: 30005
      # -- Port to use as a NodePort service
      request: 30006
    # @default `nil`
    annotations: null

  # @schema
  # $ref: "#/definitions/serviceConfig"
  # @schema
  # services.search -- Values setting up the search server service.
  search:
    type: ""
    ports:
      # -- Port to use as a NodePort service
      debug: 30002
    # @default `nil`
    annotations: null

  # @schema
  # $ref: "#/definitions/serviceConfig"
  # @schema
  # services.taskomatic -- Values setting up the taskomatic service.
  taskomatic:
    type: ""
    ports:
      # -- Port to use as a NodePort service
      debug: 30001
    # @default `nil`
    annotations: null

  # @schema
  # $ref: "#/definitions/serviceConfig"
  # @schema
  # services.tomcat -- Values setting up the tomcat service.
  tomcat:
    type: ""
    ports:
      # -- Port to use as a NodePort service
      debug: 30003
    # @default `nil`
    annotations: null

  # @schema
  # type: ["object", "null"]
  # @schema
  # services.tftp -- Values setting up the tftp service.
  tftp:
    # @default `nil`
    # @schema
    # type: ["object", "null"]
    # @schema
    annotations: null

# @schema
# type: "boolean"
# x-rancher-question:
#   label: Expose Java Debug Ports
#   group: Advanced
#   order: 840
# @schema
# exposeJavaDebug -- Expose ports 8001, 8002, and 8003 for Java debugging if true
exposeJavaDebug: false

# @schema
# type: "boolean"
# x-rancher-question:
#   label: Expose Monitoring Endpoints
#   group: Ingress
#   order: 390
# @schema
# enableMonitoring -- Create the ingress or gateway routes for Prometheus exporters if true.
enableMonitoring: true

# ingress -- Configuration of the ingress rules. Won't be used if gateway is enabled.
ingress:
  # @schema
  # enum: ["traefik", ""]
  # x-rancher-question:
  #   label: Ingress Type
  #   group: Ingress
  #   order: 370
  #   empty_option_label: Custom ingress
  #   show_if: gateway.enable=false
  # @schema
  # ingress.type -- Ingress that is used in the cluster.
  # Set to the empty string to use a custom ingress.
  type: "traefik"

  # @schema
  # x-rancher-question:
  #   label: Ingress Class
  #   group: Ingress
  #   order: 380
  #   show_if: gateway.enable=false
  #   description: Ingress class name to use. Empty means the default one. On rke2 this is likely 'traefik', on K3s it is likely empty.
  # @schema
  # ingress.class -- Specify the ingress class name to use.
  class: "traefik"

  # ingress.annotations -- Custom annotations for ingress rules.
  annotations:
    # @schema
    # $ref: "#/definitions/annotationsMap"
    # @schema
    # ingress.annotations.ssl -- annotations for the uyuni-ingress-ssl ingress definition.
    ssl: {}
    # @schema
    # $ref: "#/definitions/annotationsMap"
    # @schema
    # ingress.annotations.sslRedirect -- annotations for the uyuni-ingress-ssl-redirect ingress definition.
    sslRedirect: {}
    # @schema
    # $ref: "#/definitions/annotationsMap"
    # @schema
    # ingress.annotations.nossl -- annotations for the uyuni-ingress-nossl ingress definition.
    nossl: {}
    # @schema
    # $ref: "#/definitions/annotationsMap"
    # @schema
    # ingress.annotations.saline -- annotations for the saline-ingress-ssl ingress definition.
    saline: {}
    # @schema
    # $ref: "#/definitions/annotationsMap"
    # @schema
    # ingress.annotations.hub -- annotations for the hubapi-ingress-ssl ingress definition.
    hub: {}
    # @schema
    # $ref: "#/definitions/annotationsMap"
    # @schema
    # ingress.annotations.exporters -- annotations for the exporters-ingress-ssl ingress definition.
    exporters: {}

# gateway -- Configures the Gateway API.
gateway:
  # @schema
  # type: "boolean"
  # x-rancher-question:
  #   label: Use Gateway API
  #   group: Ingress
  #   order: 300
  #   show_subquestion_if: true
  # @schema
  # gateway.enable -- If enabled, Gateway API 1.4 resources will be deployed instead of the ingress ones.
  # Note that TCPRoute is used and is still in alpha2 stage.
  enable: false
  # @schema
  # x-rancher-question:
  #   label: Gateway Class
  #   order: 310
  #   subquestion_of: gateway.enable
  # @schema
  # gateway.class -- Name of the gateway class to use. For rke2 with traefik, it is likely to be "traefik".
  class: ""
  # @schema
  # x-rancher-question:
  #   label: Gateway Name
  #   order: 320
  #   subquestion_of: gateway.enable
  # @schema
  # gateway.name -- Name of the Gateway to use. If left empty an uyuni-gateway will be created.
  name: ""

  # gateway.listeners -- Gateway listeners configuration
  listeners:
    # @schema
    # $ref: "#/definitions/listener"
    # x-rancher-question:
    #   - variable: name
    #     label: HTTP Listener Name
    #     order: 330
    #     subquestion_of: gateway.enable
    #   - variable: port
    #     label: HTTP Listener Port
    #     order: 340
    #     subquestion_of: gateway.enable
    #     min: 1
    #     max: 65535
    # @schema
    # gateway.listeners.http -- Configuration of the HTTP listener.
    # The default is adjusted for traefik on rke2
    http:
      # gateway.listeners.http.name -- Name of the HTTP listener in the Gateway.
      name: "web"
      # gateway.listeners.http.port -- Port of the HTTP listener to set in the Gateway.
      port: 8000

    # @schema
    # $ref: "#/definitions/listener"
    # x-rancher-question:
    #   - variable: name
    #     label: HTTPS Listener Name
    #     order: 350
    #     subquestion_of: gateway.enable
    #   - variable: port
    #     label: HTTPS Listener Port
    #     order: 360
    #     subquestion_of: gateway.enable
    #     min: 1
    #     max: 65535
    # @schema
    # gateway.listeners.https -- Configuration of the HTTPS listener.
    # The default is adjusted for traefik on rke2
    https:
      # gateway.listeners.https.name -- Name of the HTTPS listener in the Gateway.
      name: "websecure"
      # gateway.listeners.https.port -- Port of the HTTPS listener to set in the Gateway.
      port: 8443

# tftp -- TFTP server configuration
tftp:
  # @default `nil`
  # @schema
  # type: ["string", "null"]
  # @schema
  # tftp.image -- Image for the TFTP server container, overwriting the one computed with the `repository` value
  image: null

  # @default `nil`
  # @schema
  # type: ["string", "null"]
  # @schema
  # tftp.tag -- Tag for the TFTP server container, overwriting the global one
  tag: null

  # @schema
  # type: "boolean"
  # x-rancher-question:
  #   label: Enable TFTP Server
  #   group: Components
  #   order: 500
  #   description: Deploy the TFTP server to PXE boot systems.
  #   show_subquestion_if: true
  # @schema
  # tftp.enable -- Define a TFTP server deployment with one replica if set to true
  enable: false

  # @schema
  # type: "boolean"
  # x-rancher-question:
  #   label: Use Host Network
  #   order: 510
  #   subquestion_of: tftp.enable
  # @schema
  # tftp.hostNetwork -- Use the host network to bypass the Kubernetes network layers.
  # This may be needed if not using a LoadBalancer for the TFTP server.
  # Note that this may be more complex to manage on multi-node clusters.
  hostNetwork: false
  
  # @schema
  # $ref: "#/definitions/nodeSelectorMap"
  # @schema
  # tftp.nodeSelector -- Node label matching rules.
  nodeSelector: {}

  # @schema
  # $ref: "#/definitions/affinityConfig"
  # @schema
  # tftp.affinity -- Advanced scheduling rules.
  affinity: {}

  # @schema
  # $ref: "#/definitions/tolerationsList"
  # @schema
  # tftp.tolerations -- Node taint tolerations.
  tolerations: []

  # @schema
  # type: ["string", "null"]
  # @schema
  # tftp.nodeName -- Specific node assignment.
  nodeName:

