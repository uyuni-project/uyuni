#   serviceConfig:
#     type: "object"
#     properties:
#       type:
#         type: "string"
#         description: "Type of service to define"
#         enum: ["ClusterIP", "NodePort", "LoadBalancer", ""]
#         default: ""
#       ports:
#         type: "object"
#         description: "Ports to expose by the service when using the NodePort type. Values need to match the port name of the service"
#       annotations:
#         type: ["object", "null"]
