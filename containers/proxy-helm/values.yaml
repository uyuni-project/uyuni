# @schema
# repository -- The default repository with the path where to find all the images.
repository: registry.opensuse.org/uyuni

# tag -- The default tag to use for all the images, can be overridden
# By default the tag will be the appVersion of the Chart.
tag: 

# @schema
# enum: ["Always", "IfNotPresent", "Never"]
# @schema
# pullPolicy -- Images pull policy. See: https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy
pullPolicy: "Always"

# registrySecret -- name of secret to use to pull the images from the
# registry with authentication. Leave empty for no authentication.
# To create the secret, see:
# https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
registrySecret: ""

# @schema
# required: true
# @schema
# global -- Variables that can be shared with a parent chart
global:
  # @schema
  # required: true
  # @schema
  # global.config -- Content of the config.yaml file generated by the server.
  # See the Systems > Proxy Configuration page on the server
  #  or the proxy.containerConfig API documentation.
  config:

  # @schema
  # required: true
  # @schema
  # global.httpd -- Content of the httpd.yaml file generated by the server.
  # See the Systems > Proxy Configuration page on the server
  #  or the proxy.containerConfig API documentation.
  httpd:

  # @schema
  # required: true
  # @schema
  # global.ssh -- Content of the ssh.yaml file generated by the server.
  # See the Systems > Proxy Configuration page on the server
  #  or the proxy.containerConfig API documentation.
  ssh:

# @schema
# $ref: "#/definitions/podDNSConfig"
# @schema
# dnsConfig -- Pod DNS configuration (Kubernetes PodDNSConfig). Omitted by default
# so the pod uses the cluster's normal DNS behavior.
# Tip: if external FQDN lookups from the proxy time out (10s urlopen),
# the cluster's default ndots:5 is likely the cause — override with:
#   dnsConfig:
#     options:
#       - name: ndots
#         value: "1"
dnsConfig:

# cert -- controls how the chart handles the proxy-cert TLS secret and the
# uyuni-ca ConfigMap.
cert:
  # cert.takeOwnership -- opts in to rendering proxy-cert and uyuni-ca even when
  # objects with those names already exist in the namespace and were NOT
  # created by helm. The default (false) leaves pre-existing objects alone
  # so install/upgrade does not fail and the chart never silently overwrites
  # something it did not create.
  #
  # Set to true together with `helm install --take-ownership` (helm 3.14+)
  # to let helm adopt the existing objects. Once adopted, value changes are
  # applied on upgrade and the objects are removed on helm uninstall.
  takeOwnership: false

# ingress -- Configuration of the ingress rules. Won't be used if gateway is enabled.
ingress:
  # @schema
  # enum: ["traefik", ""]
  # @schema
  # ingress.type -- Ingress that is used in the cluster.
  # Set to the empty string to use a custom ingress.
  type: "traefik"

  # ingress.class -- Ingress class name to use. Empty, means that the default one will be used.
  # If using the traefik end points and TCP routers, this value needs to match Traefik's
  # --providers.kubernetescrd.ingressclass parameter's value.
  # On rke2 this is likely to be "traefik". On K3S it is likely to be ""
  #
  class: "traefik"

  # ingress.annotations -- Custom annotations on the created ingress rules.
  # This can be used to configure another ingress than the ones already wired with the ingress.type.
  annotations:
    # ingress.annotations.ssl -- annotations for the uyuni-proxy-ssl ingress definition.
    ssl:

  # ingress.entryPoints -- Traefik entryPoint names the IngressRouteTCPs are bound to.
  # Must match the entryPoints configured in the Traefik installation. Override when the
  # surrounding Traefik uses custom names (e.g. mgrpxy-managed k3s installs
  # use "uyuni-ssh", "uyuni-publish", "uyuni-request").
  entryPoints:
    # ingress.entryPoints.ssh -- entrypoint name for ssh port
    ssh: "ssh"
    # ingress.entryPoints.saltPublish -- entrypoint name for salt's publish port
    saltPublish: "salt-publish"
    # ingress.entryPoints.saltRequest -- entrypoint name for salt's request port
    saltRequest: "salt-request"

# gateway -- Configures the Gateway API.
gateway:
  # @schema
  # type: "boolean"
  # default: "false"
  # @schema
  # gateway.enable -- If enabled, Gateway API 1.4 resources will be deployed instead of the ingress ones.
  # Note that TCPRoute is used and is still in alpha2 stage.
  enable: false

  # gateway.class -- Name of the gateway class to use. For rke2 with traefik, it is likely to be "traefik".
  class: ""

  # gateway.name -- Name of the Gateway to use. If left empty an uyuni-gateway will be created.
  name: ""

  # gateway.listeners -- Gateway listeners configuration
  listeners:
    # @schema
    # $ref: "#/definitions/listener"
    # @schema
    # gateway.listeners.http -- Configuration of the HTTP listener.
    # The default is adjusted for traefik on rke2
    http:
      # gateway.listeners.http.name -- Name of the HTTP listener in the Gateway.
      name: "web"
      # gateway.listeners.http.port -- Port of the HTTP listener to set in the Gateway.
      port: 8000

    # @schema
    # $ref: "#/definitions/listener"
    # @schema
    # gateway.listeners.https -- Configuration of the HTTPS listener.
    # The default is adjusted for traefik on rke2
    https:
      # gateway.listeners.https.name -- Name of the HTTPS listener in the Gateway.
      name: "websecure"
      # gateway.listeners.https.port -- Port of the HTTPS listener to set in the Gateway.
      port: 8443

# services -- Services tuning properties.
services:
  # @schema
  # enum: ["ClusterIP", "NodePort", "LoadBalancer"]
  # @schema
  # services.type -- type of all the externally-facing services. Can be overridden on each service.
  type: ClusterIP

  # @default `nil`
  # @schema
  # type: ["object", "null"]
  # @schema
  # services.annotations -- annotations to set to all the services. Merged with the service ones.
  annotations: null

  # @schema
  # $ref: "#/definitions/serviceConfig"
  # @schema
  # services.ssh -- Values setting up the ssh service
  ssh:
    type: ""
    # services.ssh.ports -- Ports to expose by the service when using the NodePort type.
    ports:
      # services.ssh.ports.ssh -- SSH port, usually known as port 22 (or 8022 in containerized SSH server)
      ssh: 30022

    # @default `nil`
    annotations:

  # @schema
  # $ref: "#/definitions/serviceConfig"
  # @schema
  # services.salt -- Values setting up the salt service.
  salt:
    type: ""
    # services.salt.ports -- Ports to expose by the service when using the NodePort type.
    ports:
      # services.salt.ports.publish -- Salt publish port, usually known as port 4505
      publish: 30005
      # services.salt.ports.request -- Salt request port, usually known as port 4506
      request: 30006
    # @default `nil`
    annotations:

  # @schema
  # $ref: "#/definitions/serviceConfig"
  # @schema
  # services.tftp -- Values setting up the tftp service.
  tftp:
    # @default `nil`
    annotations:

# @schema
# $ref: "#/definitions/nodeSelectorConfig"
# @schema
# placement -- Global placement configuration for all the proxy pods
placement:

# @schema
# $ref: "#/definitions/nodeSelectorConfig"
# @schema
# proxy -- Proxy pod placement configuration
proxy:

