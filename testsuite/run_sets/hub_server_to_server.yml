# Hub server-to-server run set.
# Requires: one hub (SERVER), one peripheral (SERVER2) and one SLE minion (MINION, bootstrapped to
# peripheral1). Without MINION the @sle_minion scenarios are skipped, and so are the reporting
# scenarios that need the minion. No proxy nodes needed. SERVER3 is optional: without it the
# cross-CA scenarios of srv_hub_token_registration.feature are skipped.
# SCC credentials are needed when the hub does not have SLES15-SP7 yet (srv_hub_prerequisites.feature).
# Tag: @hub_server_to_server

## Hub server-to-server features BEGIN ##

# Prerequisite: SLES15-SP7 product present and synced on the hub
- features/hub/srv_hub_prerequisites.feature

# A-01/A-02: Hub deployment check and registration via admin credentials
- features/hub/srv_hub_setup_registration.feature

# A-03/A-04: Registration via access token (same CA and cross-CA)
- features/hub/srv_hub_token_registration.feature

# A-05: Access token lifecycle (issue/invalidate/reactivate/delete)
- features/hub/srv_hub_token_lifecycle.feature

# B-01..B-04: sle_minion bootstrapped to peripheral1 (needed by the reporting feature)
- features/hub/srv_hub_minion_on_peripheral.feature

# A-06: ISSv3 online channel synchronization hub -> peripheral
- features/hub/srv_hub_channel_synchronization.feature

# A-07/A-08: Hub XMLRPC API namespaces
- features/hub/srv_hub_xmlrpc_operations.feature

# A-09: ISSv2 CLI export/import
- features/hub/srv_hub_issv2_export_import.feature

# C-01: Hub reportdb aggregation (removes sle_minion from peripheral1 at the end)
- features/hub/srv_hub_reporting.feature

# A-10: Peripheral deregistration and state cleanup
- features/hub/srv_hub_verification_cleanup.feature

## Hub server-to-server features END ##
