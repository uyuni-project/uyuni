# db -- PostgreSQL database configuration
db:
  # @default `nil`
  # @schema
  # type: ["string", "null"]
  # @schema
  # db.image -- Image for the database container, overwriting the one computed with the `repository` value
  image: null

  # @default `nil`
  # @schema
  # type: ["string", "null"]
  # @schema
  # db.tag -- Image tag for the database container, overwriting the global one
  tag: null

  # @schema
  # type: "boolean"
  # x-rancher-question:
  #   label: Deploy PostgreSQL
  #   group: Database
  #   order: 600
  #   description: "Deploy the internal PostgreSQL instance. WARNING: setting this to false is not supported yet."
  #   show_subquestion_if: true
  # @schema
  # db.enable -- Deploys the internal dababase if set to true. Setting to false is not supported yet.
  enable: true

  # @schema
  # x-rancher-question:
