{{- $gateway := .Values.gateway | default (dict) -}}
{{- $ingress := .Values.ingress | default (dict) -}}
{{- $ingressAnnotations := $ingress.annotations | default (dict) -}}
{{- if not $gateway.enable }}
{{- $config := .Values.global.config | fromYaml }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uyuni-proxy-ssl
  namespace: "{{ .Release.Namespace }}"
  annotations:
  {{- if eq $ingress.type "traefik" }}
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.domains.n.main: "{{ $config.proxy_fqdn }}"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure,web"
  {{- end }}
  {{- if $ingressAnnotations.ssl }}
{{ toYaml $ingressAnnotations.ssl | indent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/part-of: uyuni
    app.kubernetes.io/component: proxy
spec:
  {{- if ($ingress.class) }}
  ingressClassName: {{ $ingress.class }}
  {{- end }}
  rules:
  - host: {{ $config.proxy_fqdn }}
    http:
      paths:
      - backend:
          service:
            name: web
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - {{ $config.proxy_fqdn }}
    secretName: proxy-cert
{{- end }}
