# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test null values in volumes
templates:
  - templates/volumes.yaml
set:
  global.config: |
    max_cache_size_mb: 2048
    server: parent.example.org
    proxy_fqdn: proxy.example.org
    email: foo@example.org
  global.httpd: "httpd_content: test httpd"
  global.ssh: "ssh_content: test ssh"
tests:
  - it: should render the default squid volume when volumes is null
    set:
      volumes: null
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 2048Mi
      - notExists:
          path: spec.storageClassName
      - notExists:
          path: metadata.annotations

  - it: should render the default squid volume when its fields are null
    set:
      volumes.squid:
        storageClass: null
        extraLabels: null
        annotations: null
        volumeName: null
        selector: null
    asserts:
      - equal:
          path: metadata.labels
          value:
            app.kubernetes.io/component: proxy
            app.kubernetes.io/part-of: uyuni
      - notExists:
          path: spec.volumeName
      - notExists:
          path: spec.selector
