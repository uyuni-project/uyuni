# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test null values in server deployment
templates:
  - server.yaml
set:
  global.fqdn: uyuni.example.com
tests:
  - it: should use the default image when server.image and tags are null
    set:
      server.image: null
      server.tag: null
      tag: null
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.opensuse.org/uyuni/server:0.0.0
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: registry.opensuse.org/uyuni/server:0.0.0

  - it: should not mount a mirror when server.mirror is null
    set:
      server.mirror: null
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MIRROR_PATH
          any: true
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: mirror
          any: true

  - it: should not mount a mirror when the mirror paths are null
    set:
      server.mirror: {claimName: null, hostPath: null}
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: mirror
          any: true

  - it: should not set optional server fields when they are null
    set:
      placement: null
      server:
        sccSecret: null
        systemdLogLevel: null
        superPrivileged: null
        selinuxType: null
        apparmorProfile: null
        extraVolumes: null
        extraVolumeMounts: null
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SCC_USER
          any: true
      - notExists:
          path: spec.template.spec.containers[0].tty
      - notExists:
          path: spec.template.spec.containers[0].securityContext.seLinuxOptions.type
      - notExists:
          path: spec.template.spec.containers[0].securityContext.appArmorProfile
      - notExists:
          path: spec.template.spec.nodeSelector

