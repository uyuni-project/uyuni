{{- $gateway := .Values.gateway | default (dict) -}}
{{- $db := .Values.db | default (dict) -}}
{{- $services := .Values.services | default (dict) -}}
{{- $servicesType := $services.type | default "ClusterIP" -}}
{{- $salt := $services.salt | default (dict) -}}
{{- $reportdb := $services.reportdb | default (dict) -}}
{{- $taskomatic := $services.taskomatic | default (dict) -}}
{{- $search := $services.search | default (dict) -}}
{{- $tomcat := $services.tomcat | default (dict) -}}
{{- $listeners := $gateway.listeners | default (dict) -}}
{{- $http := $listeners.http | default (dict) -}}
{{- $https := $listeners.https | default (dict) -}}
{{- if and $gateway.enable (eq ($gateway.name | default "") "") }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: uyuni-gateway
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/part-of: uyuni
spec:
  gatewayClassName: "{{ $gateway.class }}"
  listeners:
    # HTTP/HTTPS Listeners
    - name: {{ $http.name | default "web" }}
      protocol: HTTP
      port: {{ $http.port | default 8000 }}
      allowedRoutes:
        namespaces:
          from: Same
    
    - name: {{ $https.name | default "websecure" }}
      protocol: HTTPS
      port: {{ $https.port | default 8443 }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: uyuni-cert
      allowedRoutes:
        namespaces:
          from: Same

    # TCP Listeners
    {{- if ne ($salt.type | default $servicesType) "NodePort" }}
    - name: salt-publish
      protocol: TCP
      port: 4505
      allowedRoutes:
        namespaces:
          from: Same

    - name: salt-request
      protocol: TCP
      port: 4506
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}

    {{- if and $db.enable (ne ($reportdb.type | default $servicesType) "NodePort") }}
    - name: reportdb-pgsql
      protocol: TCP
      port: 5432
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}

    # Debug TCP Listeners
    {{- if .Values.exposeJavaDebug }}
      {{- if ne ($taskomatic.type | default $servicesType) "NodePort" }}
    - name: tasko-debug
      protocol: TCP
      port: 8001
      allowedRoutes:
        namespaces:
          from: Same
      {{- end }}

      {{- if ne ($search.type | default $servicesType) "NodePort" }}
    - name: search-debug
      protocol: TCP
      port: 8002
      allowedRoutes:
        namespaces:
          from: Same
      {{- end }}

      {{- if ne ($tomcat.type | default $servicesType) "NodePort" }}
    - name: tomcat-debug
      protocol: TCP
      port: 8003
      allowedRoutes:
        namespaces:
          from: Same
      {{- end }}
    {{- end }}
{{- end }}
