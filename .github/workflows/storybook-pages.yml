name: Publish Storybook

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7
        with:
          node-version: 22.x

      - name: Use cached NPM dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 #v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-storybook-npm-${{ hashFiles('web/package-lock.json') }}

      - name: Install dependencies
        run: npm --prefix web ci --ignore-scripts --save=false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d #v6

      - name: Build Storybook
        run: npm --prefix web run build-storybook

      - name: Stage Storybook under its Pages route
        run: |
          mkdir -p web/pages/storybook
          cp -a web/storybook-static/. web/pages/storybook/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 #v5
        with:
          path: web/pages

  deploy:
    name: Deploy Storybook
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}storybook/

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 #v5
