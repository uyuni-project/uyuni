{{- $gateway := .Values.gateway | default (dict) -}}
{{- $services := .Values.services | default (dict) -}}
{{- $servicesType := $services.type | default "ClusterIP" -}}
{{- $servicesSalt := $services.salt | default (dict) -}}
{{- $servicesSsh := $services.ssh | default (dict) -}}
{{- if $gateway.enable }}
{{- $gatewayName := $gateway.name | default "uyuni-gateway" -}}
  {{- if ne (default $servicesType $servicesSalt.type) "NodePort" }}
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: salt-publish
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/part-of: uyuni
spec:
  parentRefs:
  - name: {{ $gatewayName }}
    sectionName: salt-publish
  rules:
    - backendRefs:
      - name: salt
        port: 4505
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: salt-request
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/part-of: uyuni
spec:
  parentRefs:
  - name: {{ $gatewayName }}
    sectionName: salt-request
  rules:
    - backendRefs:
      - name: salt
        port: 4506
---
  {{- end }}
  {{- if ne (default $services.type $servicesSsh.type) "NodePort" }}
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: ssh
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/part-of: uyuni
spec:
  parentRefs:
  - name: {{ $gatewayName }}
    sectionName: ssh
  rules:
    - backendRefs:
      - name: ssh
        port: 8022
  {{- end }}
{{- end }}

