  # -- Image tag for the database container, overwriting the global one
  tag: null

  enable: true

  # @schema
  # $ref: "#/definitions/dbConnectionConfig"
  # @schema
  # -- Configuration of the internal database connection
  internal:
    # @default `nil`
    # @schema
    # type: ["string", "null"]
    # @schema
    host: null

    port: 5432

    # @default `nil`
    # @schema
    # type: ["string", "null"]
    # @schema
    name: null

  # @schema
  # $ref: "#/definitions/dbConnectionConfig"
