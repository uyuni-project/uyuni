# volumes -- Configuration of persistent volume claims.
volumes:
  # @schema
  # type: ["object", "null"]
  # @schema
  # volumes.squid -- Squid proxy's cache volume.
  # The size of the squid cache is set when creating the configuration file on the server side.
  squid:
    # @schema
    # type: ["string", "null"]
    # @schema
    # volumes.squid.storageClass -- storage class to use for the volume claim.
    # The storage class supports a special "-" value to force the storage class to the empty string.
    # This is different from the "" value representing the default storage class by not setting any storage class at all.
    storageClass:
    # @schema
    # type: ["object", "null"]
    # @schema
    # volumes.squid.extraLabels -- labels to add to the volume claim
    extraLabels:
    # @schema
    # type: ["object", "null"]
    # @schema
    # volumes.squid.annotations -- annotations to set to the volume claim
    annotations:
    # @schema
    # type: ["string", "null"]
    # @schema
    # volumes.squid.volumeName -- name of the volume to force binding the claim to
    volumeName:
    # @schema
    # type: ["object", "null"]
    # @schema
    # volumes.squid.selector -- selector to set to the volume claim to bind to a volume
    selector:

