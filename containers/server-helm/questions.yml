# Generated by helm-questions from the x-rancher-question annotations in the values schema.
# Do not edit, update the annotations and run helm questions again.
questions:
  - variable: global.fqdn
    label: Server FQDN
    description: Fully qualified name the server will answer as.
    type: string
    group: General
  - variable: server.email
    label: Notification Email
    description: Email used for the notifications sent by the server.
    type: string
    default: admin@uyuni.lab.org
    group: General
  - variable: timezone
    label: Time Zone
    description: The time zone to set in the containers
    type: string
    default: Etc/UTC
    group: General
  - variable: server.sccSecret
    label: SCC Credentials Secret
    description: Name of a basic-auth secret with the organization mirroring credentials to set up on the server. Leave empty for none. Once selected, it can only be cleared by editing the values YAML.
    type: secret
    default: ""
    group: General
  - variable: repository
    label: Image Repository
    description: The default repository with the path where to find all the images.
    type: string
    default: registry.opensuse.org/uyuni
    group: General
  - variable: tag
    label: Image Tag
    description: The default tag to use for all the images, can be overridden By default the tag will be the appVersion of the Chart.
    type: string
    group: General
  - variable: pullPolicy
    label: Image Pull Policy
    description: 'Images pull policy. See: https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy'
    type: enum
    default: IfNotPresent
    options:
      - Always
      - IfNotPresent
      - Never
    group: General
  - variable: registrySecret
    label: Registry Pull Secret
    description: Name of the secret used to pull the images from a registry with authentication. Leave empty for no authentication. Once selected, it can only be cleared by editing the values YAML.
    type: secret
    default: ""
    group: General
  - variable: gateway.enable
    label: Use Gateway API
    description: If enabled, Gateway API 1.4 resources will be deployed instead of the ingress ones. Note that TCPRoute is used and is still in alpha2 stage.
    type: boolean
    default: false
    group: General
    show_subquestion_if: true
    subquestions:
      - variable: gateway.class
        label: Gateway Class
        description: Name of the gateway class to use. For rke2 with traefik, it is likely to be "traefik".
        type: string
        default: ""
      - variable: gateway.name
        label: Gateway Name
        description: Name of the Gateway to use. If left empty an uyuni-gateway will be created.
        type: string
        default: ""
  - variable: ingress.type
    label: Ingress Type
    description: Ingress that is used in the cluster. Set to the empty string to use a custom ingress.
    type: enum
    default: traefik
    options:
      traefik: traefik
      "": Custom ingress
    group: General
    show_if: gateway.enable=false
  - variable: ingress.class
    label: Ingress Class
    description: Specify the ingress class name to use.
    type: string
    default: traefik
    group: General
    show_if: gateway.enable=false
  - variable: enableMonitoring
    label: Expose Monitoring Endpoints
    description: Create the ingress or gateway routes for Prometheus exporters if true.
    type: boolean
    default: true
    group: Advanced
  - variable: services.type
    label: Service Type
    description: type of all the externally-facing services. Can be overridden on each service.
    type: enum
    default: ClusterIP
    options:
      - ClusterIP
      - NodePort
      - LoadBalancer
    group: General
  - variable: tftp.enable
    label: Enable TFTP Server
    description: Define a TFTP server deployment with one replica if set to true
    type: boolean
    default: false
    group: Advanced
    show_subquestion_if: true
    subquestions:
      - variable: tftp.hostNetwork
        label: Use Host Network
        description: Use the host network to bypass the Kubernetes network layers. This may be needed if not using a LoadBalancer for the TFTP server. Note that this may be more complex to manage on multi-node clusters.
        type: boolean
        default: false
  - variable: hubAPI.enable
    label: Enable Hub XML-RPC API
    description: Define a hub API deployment with one replica if set to true.
    type: boolean
    default: false
    group: Advanced
  - variable: saline.enable
    label: Enable Saline
    description: Define a saline deployment with one replica if set to true.
    type: boolean
    default: false
    group: Advanced
  - variable: coco.replicas
    label: Confidential Computing Attestation Replicas
    description: Number the confidential computing pods replicas
    type: int
    default: 0
    group: Advanced
    min: 0
  - variable: db.enable
    label: Deploy PostgreSQL
    description: Deploys the internal dababase if set to true. Setting to false is not supported yet.
    type: boolean
    default: true
    group: Advanced
    show_subquestion_if: true
    subquestions:
      - variable: db.podsCIDR
        label: Pods CIDR
        description: Network IP range to allow plain text connections from, usually the cluster pods CIDR The default has been adjusted with rke2's pods CIDR default.
        type: string
        default: 10.42.0.0/16
  - variable: volumes.storageClass
    label: Default Storage Class
    description: Storage class used for all the volume claims. Leave empty to use the cluster default. Once selected, it can only be cleared by editing the values YAML.
    type: storageclass
    group: General
  - variable: server.mirror.claimName
    label: Mirror Volume Claim
    description: Existing PVC to mount as the server.susemanager.fromdir mirror. Leave empty for none. Once selected, it can only be cleared by editing the values YAML.
    type: pvc
    default: ""
    group: Advanced
  - variable: server.mirror.hostPath
    label: Mirror Host Path
    description: Path on the node to mount as mirror.
    type: string
    default: ""
    group: Advanced
  - variable: server.superPrivileged
    label: Super Privileged Server
    description: Set to true to run on a cluster with selinux or AppArmor enforced.
    type: boolean
    default: false
    group: General
    show_subquestion_if: "false"
    subquestions:
      - variable: server.apparmorProfile
        label: AppArmor Profile
        description: Name of an AppArmor profile to use for the server pod.
        type: string
        default: ""
      - variable: server.selinuxType
        label: SELinux Type
        description: Name of the SELinux type to use for the server pod.
        type: string
        default: ""
  - variable: server.systemdLogLevel
    label: Systemd Log Level
    description: Systemd log level to use for debugging
    type: enum
    default: ""
    options:
      debug: debug
      info: info
      notice: notice
      warning: warning
      err: err
      crit: crit
      alert: alert
      emerg: emerg
      "": Default
    group: Advanced
  - variable: exposeJavaDebug
    label: Expose Java Debug Ports
    description: Expose ports 8001, 8002, and 8003 for Java debugging if true
    type: boolean
    default: false
    group: Advanced
