# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test null values in gateway
templates:
  - templates/gateway.yaml
set:
  global.config: |
    max_cache_size_mb: 2048
    server: parent.example.org
    proxy_fqdn: proxy.example.org
    email: foo@example.org
  global.httpd: "httpd_content: test httpd"
  global.ssh: "ssh_content: test ssh"
tests:
  - it: should not render the gateway when gateway is null
    set:
      gateway: null
    asserts:
      - hasDocuments:
          count: 0

  - it: should render the gateway when gateway.name and gateway.class are null
    set:
      gateway.enable: true
      gateway.name: null
      gateway.class: null
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.gatewayClassName
          value: ""

  - it: should use the default listeners when gateway.listeners is null
    set:
      gateway.enable: true
      gateway.listeners: null
    asserts:
      - equal:
          path: spec.listeners[0]
          value:
            name: web
            protocol: HTTP
            port: 8000
            allowedRoutes:
              namespaces:
                from: Same
      - equal:
          path: spec.listeners[1].name
          value: websecure
      - equal:
          path: spec.listeners[1].port
          value: 8443

  - it: should not reuse the http name for the https listener
    set:
      gateway.enable: true
      gateway.listeners.http.name: plain
      gateway.listeners.https: null
    asserts:
      - equal:
          path: spec.listeners[0].name
          value: plain
      - equal:
          path: spec.listeners[1].name
          value: websecure

  - it: should render the TCP listeners when services is null
    set:
      gateway.enable: true
      services: null
    asserts:
      - lengthEqual:
          path: spec.listeners
          count: 5

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test null values in routes
templates:
  - templates/routes.yaml
  - templates/tcp-routes.yaml
set:
  global.config: |
    max_cache_size_mb: 2048
    server: parent.example.org
    proxy_fqdn: proxy.example.org
    email: foo@example.org
  global.httpd: "httpd_content: test httpd"
  global.ssh: "ssh_content: test ssh"
tests:
  - it: should not render routes when gateway is null
    set:
      gateway: null
    asserts:
      - hasDocuments:
          count: 0

  - it: should use the default gateway and listener names when null
    set:
      gateway.enable: true
      gateway.name: null
      gateway.listeners: null
    asserts:
      - equal:
          path: spec.parentRefs
          value:
            - name: uyuni-gateway
              sectionName: websecure
            - name: uyuni-gateway
              sectionName: web
        template: templates/routes.yaml

  - it: should render all TCP routes on the default gateway when values are null
    set:
      gateway.enable: true
      gateway.name: null
      services: null
    asserts:
      - hasDocuments:
          count: 3
        template: templates/tcp-routes.yaml
      - equal:
          path: spec.parentRefs[0].name
          value: uyuni-gateway
        template: templates/tcp-routes.yaml

